<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f9">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="../manifest.webmanifest?v=2.8.63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CCC – Logga in</title>
<script>
try{
  const t=localStorage.getItem("ccc-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  document.documentElement.dataset.theme=t;
  const c=t==="dark"?"#11141b":"#f7f7f9";
  document.documentElement.style.backgroundColor=c;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute("content",c);
}catch(e){}
</script>
<link rel="stylesheet" href="../core.css?v=2.8.63">
<link rel="stylesheet" href="auth.css?v=2.8.63">
</head>
<body class="auth-checking">
<main class="auth-shell">
  <section class="login-card" aria-labelledby="loginTitle">
    <div class="auth-brand brand ccc-brand-mark">
      <span class="brand-halo ccc-brand-halo" aria-hidden="true"><span class="ccc-aura-arc"></span></span>
      <h1 id="loginTitle" class="brand-word ccc-brand-word"><span>C</span><span class="ccc-brand-middle">C</span><span>C</span></h1>
    </div>
    <form id="loginForm" autocomplete="on">
      <input id="email" name="username" type="email" placeholder="E-post" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
      <div class="password-wrap">
        <input id="password" name="password" type="password" placeholder="Lösenord" autocomplete="current-password">
        <button id="togglePassword" type="button" aria-label="Visa lösenord">👁</button>
      </div>
      <button id="loginButton" class="login-button">Logga in</button>
      <div class="auth-divider" aria-hidden="true"><span></span></div>
      <a class="create-account-button" href="register.html">Skapa konto</a>
      <button id="resetPassword" class="forgot" type="button">Glömt lösenord?</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<div id="loginSuccess" class="login-success" hidden aria-live="polite">
  <span class="success-check">✓</span>
  <strong>Välkommen in</strong>
  <small>CCC startar arbetsytan…</small>
</div>
<script src="../version.js?v=2.8.63"></script>
<script type="module" src="auth.js?v=2.8.63"></script>
<script src="../pwa.js?v=2.8.63" defer></script>
</body>
</html>
