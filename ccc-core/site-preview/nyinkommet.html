    <style>
        .ccc-preview-banner {
            position: sticky;
            top: 0;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: .58rem .9rem;
            background: #151922;
            color: #e4b84f;
            border-bottom: 1px solid rgba(228,184,79,.6);
            font: 800 .78rem/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .ccc-preview-banner.is-active { display: flex; }
        .ccc-preview-banner::before {
            content: "●";
            font-size: .65rem;
        }
        .ccc-preview-back { margin-left:auto; border:1px solid rgba(228,184,79,.55); border-radius:999px; padding:.34rem .62rem; background:transparent; color:#e4b84f; font:inherit; letter-spacing:.04em; text-transform:none; cursor:pointer; }
        @media (max-width:520px) { .ccc-preview-banner { justify-content:flex-start; padding-inline:.7rem; } .ccc-preview-banner::before { display:none; } .ccc-preview-back { font-size:.72rem; } }
        .page-header .logo-small {
            display: block;
            width: 680px;
            width: min(680px, 82vw);
            max-width: 82vw;
            margin: 0 auto 18px;
        }

        .page-header h1 {
            margin: 0 0 12px;
        }

        @media (max-width: 700px) {
            .page-header .logo-small {
                width: 320px;
                width: min(320px, 86vw);
                max-width: 86vw;
                margin-bottom: 24px;
            }
        }

        /* CCC v2.9.70 – adaptive, row-aligned card geometry in preview */
        #nyGallery { align-items: stretch; }

        #nyGallery .gallery-item.nyinkommet-kort {
            display:flex;
            flex-direction:column;
            height:100%;
            align-self:stretch;
        }

        #nyGallery .nyinkommet-bildknapp {
            flex:0 0 auto;
            width:100%;
            aspect-ratio:1 / 1;
        }

        #nyGallery .nyinkommet-info {
            box-sizing:border-box;
            flex:1 1 auto;
            display:flex !important;
            flex-direction:column;
            padding:11px 15px 13px;
        }

        #nyGallery .nyinkommet-titel {
            margin:0 !important;
            line-height:1.35;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
        }

        #nyGallery .nyinkommet-beskrivning {
            margin:6px 0 0 !important;
            color:#666;
            font-size:.9em;
            line-height:1.35;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
        }

        #nyGallery .nyinkommet-datum {
            margin-top:auto !important;
            margin-bottom:0 !important;
            padding-top:8px;
        }

    </style>

</head>

    </main>

        aria-hidden="true">

        <button

            &times;

        </button>

        <button
            class="prev"
            type="button">

            &#10094;

        </button>

        <img
            id="lightboxImage"
            alt="Nyinkommet">

        <button
            class="next"
            type="button">

            &#10095;

        </button>

    </div>
