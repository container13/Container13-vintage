<!doctype html>
<html lang="sv"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f9"><meta name="color-scheme" content="light dark">
<title>CCC Vinted</title>
<script>try{const t=localStorage.getItem("ccc-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="../core.css?v=2.10.185"><link rel="stylesheet" href="vinted.css?v=2.10.185">
</head><body>
<header class="v-head">
  <a href="../dashboard/index.html?v=2.10.185" class="v-back" aria-label="Tillbaka">‹</a>
  <div class="v-head-title"><b>VINTED</b><span>CCC</span></div>
  <span class="js-ccc-version v-version"></span>
</header>
<main class="v-main">
<section class="v-intro"><h1>Skapa annons</h1><p>1–9 bilder av samma plagg</p></section>
<section class="v-card">
<div class="v-card-head"><strong>Bilder</strong><span id="count">0 / 9</span></div>
<div id="photos" class="v-photos"></div>
<div class="v-photo-actions">
  <button id="cameraAdd" class="v-photo-action" type="button"><span>◎</span><b>Ta foto</b><small>Fortsätt upp till 9 bilder</small></button>
  <button id="albumAdd" class="v-photo-action" type="button"><span>▧</span><b>Välj från album</b><small>En eller flera bilder</small></button>
</div>
<input id="cameraPicker" type="file" accept="image/*" capture="environment" hidden>
<input id="albumPicker" type="file" accept="image/*" multiple hidden>
<p id="photoNote" class="v-note">Bilderna används både i annonsen och som underlag för analysen.</p>
</section>
<section class="v-card v-settings">
<div><strong>Språk</strong><small>Språket för titel och beskrivning</small></div>
<div class="v-segment" role="group" aria-label="Språk"><button class="active" data-lang="sv-SE" type="button">Svenska</button><button data-lang="en" type="button">English</button></div>
</section>
<p id="analysisStatus" class="v-note" role="status" aria-live="polite"></p>
<button id="analyze" class="v-analyze" type="button" disabled>Analysera bilder</button>
<section id="result" class="v-result" hidden>
<div class="v-result-head"><div><span>DIN ANNONS</span><h2>Kontrollera och kopiera</h2></div><small>Tryck på symbolen till höger</small></div>
<div id="fields" class="v-fields"></div><button id="copyListing" class="v-analyze" type="button">▢ Kopiera Vinted-annons</button><p id="copyListingStatus" class="v-note" role="status" aria-live="polite"></p>
</section>
</main><dialog id="editDialog" class="v-edit-dialog" aria-labelledby="editHeading"><form id="editForm" method="dialog"><h2 id="editHeading">Redigera</h2><textarea id="editInput" rows="5" aria-label="Ändra text"></textarea><div class="v-dialog-actions"><button id="editCancel" type="button">Avbryt</button><button id="editSave" type="submit">Spara</button></div></form></dialog>
<script src="../vision/vision-ai-config.js?v=2.10.185"></script><script src="../vision/vision-ai.js?v=2.10.185"></script><script src="../version.js?v=2.10.185"></script><script src="vinted.js?v=2.10.185-listing1"></script>
</body></html>
