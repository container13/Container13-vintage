<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCC - Logga in</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="login-card">
<h1>CCC</h1>
<p>Välkommen tillbaka</p>

<form id="loginForm" autocomplete="on">
<input id="email" name="username" type="email" placeholder="E-post" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">

<div class="password-wrap">
<input id="password" name="password" type="password" placeholder="Lösenord" autocomplete="current-password">
<button id="togglePassword" type="button">👁</button>
</div>

<button id="loginButton">Logga in</button>
<button id="resetPassword" class="forgot" type="button">Glömt lösenord?</button>

<p id="message"></p>
</form>
</main>
<script type="module" src="js/login.js?v=16"></script>
</body>
</html>
