<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>CCC - Kontrollcenter</title>
<link rel="stylesheet" href="css/ccc-base.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<main class="workspace">

<header class="topbar">
  <div class="logo">CCC</div>
  <div class="icons">🌗 👤 ⚙️</div>
</header>

<section class="workspace-head">
  <h1>Container13</h1>
  <p>🏪 Butik / Handel</p>
</section>

<section class="hero">
  <h2>God morgon 👋</h2>
  <p>Här är din arbetsyta. Vad vill du göra idag?</p>
</section>

<section class="quick-grid">
  <button><strong>📸</strong><span>Ta foto</span><small>Skapa nytt innehåll direkt</small></button>
  <button><strong>➕</strong><span>Nytt plagg</span><small>Lägg till produkt</small></button>
  <button><strong>📢</strong><span>Marknadsför</span><small>Skapa nästa inlägg</small></button>
  <button><strong>🔔</strong><span>Bevakningar</span><small>Se vad som händer</small></button>
</section>

<section class="summary">
  <h3>Översikt</h3>
  <div>
    <button>📊 Statistik</button>
    <button>⚙️ Inställningar</button>
  </div>
</section>

</main>
</body>
</html>
