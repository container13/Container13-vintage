<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCC - Arbetsyta</title>
<link rel="stylesheet" href="css/ccc-base.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<main class="workspace">

<header class="header">
  <div>
    <div class="brand">CCC</div>
    <div class="company">Container13</div>
    <div class="industry">🏪 Butik / Handel</div>
  </div>
  <div class="tools">🌗 👤 ⚙️</div>
</header>

<section class="welcome">
  <h1>Hej Magnus 👋</h1>
  <p>Vad vill du göra idag?</p>
</section>

<section class="main-actions">

<a class="action">
  <span>📸</span>
  <div>
    <strong>Skapa något nytt</strong>
    <small>Börja med en idé, bild eller produkt</small>
  </div>
</a>

<a class="action">
  <span>➕</span>
  <div>
    <strong>Lägg till</strong>
    <small>Registrera något nytt</small>
  </div>
</a>

<a class="action">
  <span>📢</span>
  <div>
    <strong>Visa upp</strong>
    <small>Nå ut till dina kunder</small>
  </div>
</a>

<a class="action">
  <span>🔔</span>
  <div>
    <strong>Följ upp</strong>
    <small>Se vad som behöver din uppmärksamhet</small>
  </div>
</a>

</section>

<section class="quick">
  <h2>Snabböversikt</h2>
  <div class="mini">
    📊 Statistik
  </div>
  <div class="mini">
    ⚙️ Inställningar
  </div>
</section>

</main>

</body>
</html>
