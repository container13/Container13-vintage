<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">CCC</div>
  <button id="themeToggle" class="theme-toggle" aria-label="Byt tema">◐</button>
</header>

<main class="app-shell">

<section id="welcomeView" class="view active">
<div class="card">
<h1>Välkommen till CCC</h1>
<p>Gör ditt företag enklare.<br>Din digitala assistent för småföretagare.</p>

<button class="primary" onclick="showView('loginView')">Logga in</button>
<button class="secondary" onclick="showView('onboardingView')">Skapa nytt företag</button>
</div>
</section>

<section id="loginView" class="view">
<div class="card">
<h1>Logga in</h1>

<label>E-post</label>
<input type="email">

<label>Lösenord</label>
<input type="password">

<button class="primary">Logga in</button>
<button class="text-button" onclick="showView('welcomeView')">Tillbaka</button>
</div>
</section>

<section id="onboardingView" class="view">
<div class="card">
<h1>Kom igång med CCC</h1>

<p>
Vi hjälper dig att hitta dina företagsuppgifter.
</p>

<label>Personnummer eller organisationsnummer</label>
<input id="identifier" placeholder="Ange uppgift">

<button class="primary">
Hämta uppgifter
</button>

<div class="divider"></div>

<p>Vill du testa CCC först utan att ange uppgifter?</p>

<button class="secondary">
Skapa testkonto
</button>

<button class="text-button" onclick="showView('welcomeView')">
Tillbaka
</button>

</div>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
