<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Micke 50 – Admin</title><style>body{background:#17120e;color:#f9e7b6;font:16px system-ui;margin:0;text-align:center}main{max-width:920px;margin:auto;padding:25px 12px}h1{color:#e6bb5b}button{background:#e6bb5b;color:#17120e;border:0;border-radius:12px;padding:13px 19px;font-weight:700;margin:6px}input{padding:14px;border-radius:9px;border:1px solid #c9a457;background:#30251a;color:white;font-size:20px;max-width:240px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-top:20px}.tile{position:relative;border:3px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer}.tile.selected{border-color:#e6bb5b}.tile img{width:100%;height:160px;object-fit:cover;display:block}.tick{position:absolute;top:8px;right:8px;background:#17120ecc;padding:4px 7px;border-radius:8px}.hidden{display:none}#msg{min-height:30px}a{color:#e6bb5b}</style></head><body><main><h1>🔐 Micke 50 – Admin</h1><p><a href="./">← Tillbaka till festen</a></p><section id="login"><p>Ange din tioställiga administratörskod.</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" autocomplete="off" placeholder="10 siffror"><br><button id="enter">Logga in</button></section><section id="panel" class="hidden"><p>Tryck på bilderna för att markera dem.</p><button id="refresh">Uppdatera</button><button id="delete">Radera markerade (0)</button><button id="logout">Logga ut</button><div id="grid"></div></section><p id="msg" role="status"></p></main><script>
const endpoint='https://qcchvqahibbbpijhtwsh.supabase.co/functions/v1/micke50-admin';let pin='',items=[],selected=new Set();const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t}async function request(action,names=[]){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,action,names})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Serverfel '+r.status);return data}async function refresh(){try{msg('Hämtar bilder…');const data=await request('list');items=data.files||[];selected.clear();render();msg(items.length+' bilder hittades.')}catch(e){msg('Kunde inte hämta bilder: '+e.message)}}function render(){$('grid').replaceChildren(...items.map(f=>{const tile=document.createElement('div');tile.className='tile'+(selected.has(f.name)?' selected':'');const img=document.createElement('img');img.src=f.url;img.alt='Festbild';img.loading='lazy';const tick=document.createElement('span');tick.className='tick';tick.textContent=selected.has(f.name)?'✓':'○';tile.append(img,tick);tile.onclick=()=>{selected.has(f.name)?selected.delete(f.name):selected.add(f.name);render()};return tile}));$('delete').textContent='Radera markerade ('+selected.size+')'}$('enter').onclick=async()=>{const value=$('pin').value;if(!/^\d{10}$/.test(value)){msg('Koden ska innehålla exakt 10 siffror.');return}pin=value;$('pin').value='';try{await request('check');$('login').classList.add('hidden');$('panel').classList.remove('hidden');refresh()}catch(e){pin='';msg('Inloggningen misslyckades: '+e.message)}};$('refresh').onclick=refresh;$('logout').onclick=()=>{pin='';items=[];selected.clear();$('panel').classList.add('hidden');$('login').classList.remove('hidden');msg('Utloggad.')};$('delete').onclick=async()=>{if(!selected.size)return;const names=[...selected];if(!confirm('Radera '+names.length+' bild(er) permanent?'))return;try{msg('Raderar…');const result=await request('delete',names);msg(result.deleted+' bild(er) raderade.');await refresh()}catch(e){msg('Radering misslyckades: '+e.message)}};
</script></body></html>
