<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17120e"><title>Micke 50 år</title><style>body{margin:0;background:#17120e;color:#f9e7b6;font:16px system-ui;text-align:center}header{padding:40px 16px 20px}h1{font-size:clamp(40px,10vw,80px);margin:0;color:#e6bb5b}p{line-height:1.5}button,.btn{display:inline-block;background:#e6bb5b;color:#17120e;padding:16px 22px;border:0;border-radius:14px;font-weight:700;font-size:17px;margin:8px;cursor:pointer}input{display:none}#status{min-height:24px}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:20px;max-width:1100px;margin:auto}#gallery img{width:100%;height:230px;object-fit:cover;border-radius:12px;cursor:pointer}#viewer{display:none;position:fixed;inset:0;background:#000e;z-index:3;align-items:center;justify-content:center}#viewer img{max-width:95vw;max-height:90vh;object-fit:contain}#close{position:absolute;top:10px;right:10px}small{color:#d2c3a6}#intro{position:fixed;inset:0;z-index:20;background:#17120e;display:flex;align-items:center;justify-content:center;overflow:hidden}#intro img{width:100%;height:100%;object-fit:cover;object-position:center 35%}#intro .caption{position:absolute;top:44%;left:5%;right:5%;color:#f2ca69;font-weight:900;font-size:clamp(38px,11vw,90px);text-shadow:0 3px 14px #000,0 1px 5px #000;letter-spacing:.03em}#intro:before{content:"";position:absolute;inset:12px;border:2px solid #d7aa52;box-shadow:inset 0 0 0 5px #17120e99,inset 0 0 0 7px #e9d39a;z-index:2;pointer-events:none;border-radius:5px}#intro:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003 0%,transparent 27%,transparent 52%,#0009 100%);pointer-events:none}#intro .caption{top:auto!important;bottom:11%;font-family:Georgia,serif;font-size:clamp(34px,9vw,78px)!important;letter-spacing:.055em!important;line-height:1.05;padding:14px 4px;border-top:1px solid #f2ca69;border-bottom:1px solid #f2ca69;z-index:3;text-shadow:0 3px 12px #000}#intro.fade{opacity:0;transition:opacity .65s;pointer-events:none}@media(prefers-reduced-motion:reduce){#intro.fade{transition:none}}</style></head><body><div id="intro" aria-label="Micke 50 år"><img src="micke-start.jpg" alt="Micke" onerror="this.style.display='none'"><div class="caption">MICKE 50 ÅR!</div></div><header><h1>MICKE 50 ÅR! 🎉</h1><h2>Välkommen till Mickes 50-årsfest</h2><p>Hjälp Micke att föreviga kvällen!<br>Ta bilder, dela era bästa ögonblick och skapa ett minne för livet.</p><label class="btn">📷 Ta foto<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="btn">🖼️ Välj bilder<input id="files" type="file" accept="image/*" multiple></label><br><button id="slideshow">▶ Bildspel för TV</button><p id="status" aria-live="polite"></p><small>Alla uppladdade bilder kan ses av andra med länken. Ladda bara upp bilder du har rätt att dela.</small></header><h2>Festbilderna</h2><div id="gallery"></div><div id="viewer"><button id="close">✕ Stäng</button><img id="large" alt="Festbild"></div><script>setTimeout(()=>{const el=document.getElementById('intro');el.classList.add('fade');setTimeout(()=>el.remove(),700)},5000);const endpoint='https://qcchvqahibb bpijhtwsh.supabase.co'.replace(' ','');const key='sb_publishable_jKuOB0aRCwZlCpVfn3sK5A_jclOM7dT';const bucket='Micke50bilder';const base=endpoint+'/storage/v1';const headers={apikey:key,Authorization:'Bearer '+key};const status=document.getElementById('status');let urls=[],pos=0,timer;async function load(){try{const r=await fetch(base+'/object/list/'+bucket,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({prefix:'',limit:1000,offset:0,sortBy:{column:'created_at',order:'desc'}})});if(!r.ok)throw Error('Galleriet kan inte hämtas ('+r.status+').');const a=await r.json();urls=a.filter(x=>x.name&&!x.name.startsWith('.')).map(x=>base+'/object/public/'+bucket+'/'+encodeURIComponent(x.name));document.getElementById('gallery').replaceChildren(...urls.map((u,i)=>{const img=document.createElement('img');img.src=u;img.loading='lazy';img.alt='Festbild '+(i+1);img.onclick=()=>show(i);return img}));}catch(e){status.textContent=e.message}}async function upload(list){let ok=0;for(const f of list){if(!f.type.startsWith('image/'))continue;if(f.size>20*1024*1024){status.textContent=f.name+' är större än 20 MB';continue}status.textContent='Laddar upp '+(ok+1)+' av '+list.length+'…';const name=Date.now()+'-'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');try{const r=await fetch(base+'/object/'+bucket+'/'+encodeURIComponent(name),{method:'POST',headers:{...headers,'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok)throw Error(await r.text());ok++}catch(e){status.textContent='Fel vid uppladdning: '+e.message;return}}status.textContent=ok+' bild(er) uppladdade!';await load()}document.getElementById('files').onchange=e=>upload([...e.target.files]);document.getElementById('camera').onchange=e=>upload([...e.target.files]);function show(i){if(!urls.length)return;pos=(i+urls.length)%urls.length;document.getElementById('large').src=urls[pos];document.getElementById('viewer').style.display='flex'}function close(){clearInterval(timer);document.getElementById('viewer').style.display='none'}document.getElementById('close').onclick=close;document.getElementById('viewer').onclick=e=>{if(e.target.id==='viewer')close()};document.getElementById('slideshow').onclick=()=>{if(!urls.length){status.textContent='Inga bilder ännu';return}show(0);clearInterval(timer);timer=setInterval(()=>show(pos+1),5000)};load();setInterval(load,15000);</script></body></html>
