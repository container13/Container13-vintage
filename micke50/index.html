<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#17120e">
<title>Micke 50 år – Tack för festen!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17120e;color:#f9e7b6;font-family:system-ui,-apple-system,sans-serif;text-align:center}
body{display:grid;place-items:center;padding:24px}
main{max-width:520px;padding:32px 22px;border:1px solid #705629;border-radius:22px;background:#231a12}
h1{font-size:clamp(36px,9vw,62px);color:#e6bb5b;margin:0 0 20px}
p{font-size:clamp(18px,4.6vw,22px);line-height:1.55;margin:16px 0}
.note{color:#d6bd83;font-size:16px;margin-top:28px}
#intro{position:fixed;inset:0;z-index:20;background:#17120e;display:flex;align-items:center;justify-content:center;overflow:hidden}
#intro img{width:100%;height:100%;object-fit:contain}
#intro.fade{opacity:0;transition:opacity .65s;pointer-events:none}
@media(prefers-reduced-motion:reduce){#intro.fade{transition:none}}
</style>
</head>
<body>
<div id="intro" aria-label="Micke 50 år"><img src="micke-fest.jpg" alt="Micke" onerror="this.style.display='none'"></div>
<main>
<h1>MICKE 50 ÅR! 🎉</h1>
<p><strong>Tack för en fantastisk 50-årsfest! ❤️</strong></p>
<p>Vill du ha bilderna från festen?<br>Kontakta Micke så hjälper han dig.</p>
<p class="note">Uppladdningen av nya bilder är avslutad.</p>
</main>
<script>
setTimeout(()=>{const el=document.getElementById('intro');if(!el)return;el.classList.add('fade');setTimeout(()=>el.remove(),700)},2000);
</script>
</body>
</html>
