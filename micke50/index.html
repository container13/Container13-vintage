<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17120e"><title>Micke 50 år</title><style>body{margin:0;background:#17120e;color:#f9e7b6;font:16px system-ui;text-align:center}header{padding:40px 16px 20px}h1{font-size:clamp(40px,10vw,80px);margin:0;color:#e6bb5b}p{line-height:1.5}button,.btn{display:inline-block;background:#e6bb5b;color:#17120e;padding:16px 22px;border:0;border-radius:14px;font-weight:700;font-size:17px;margin:8px;cursor:pointer}input{display:none}#status{min-height:24px}#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:20px;max-width:1100px;margin:auto}#gallery img{width:100%;height:230px;object-fit:cover;border-radius:12px;cursor:pointer}#viewer{display:none;position:fixed;inset:0;background:#000e;z-index:3;align-items:center;justify-content:center}#viewer img{max-width:95vw;max-height:90vh;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}#viewer{touch-action:none;overscroll-behavior:contain}#large{will-change:transform,opacity;transition:transform .22s ease-out,opacity .22s ease-out}#large.dragging{transition:none}#close{position:absolute;top:10px;right:10px;z-index:5}#viewerCount{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#17120ecc;color:#f9e7b6;padding:8px 15px;border-radius:30px;font-weight:700;z-index:4}#viewerControls{position:absolute;bottom:65px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;z-index:4}#viewerControls button{padding:10px 14px;margin:0;font-size:14px}#viewerControls select{font-size:16px;padding:10px;background:#17120e;color:#f9e7b6;border:1px solid #e6bb5b;border-radius:9px}#session{display:none;padding:12px}#session button{font-size:15px;padding:12px}#sessionCount{display:block}small{color:#d2c3a6}#intro{position:fixed;inset:0;z-index:20;background:#17120e;display:flex;align-items:center;justify-content:center;overflow:hidden}#intro img{width:100%;height:100%;object-fit:contain;object-position:center}#intro .caption{position:absolute;top:44%;left:5%;right:5%;color:#f2ca69;font-weight:900;font-size:clamp(38px,11vw,90px);text-shadow:0 3px 14px #000,0 1px 5px #000;letter-spacing:.03em}#intro .caption{top:auto!important;bottom:11%;font-family:Georgia,serif;font-size:clamp(34px,9vw,78px)!important;letter-spacing:.055em!important;line-height:1.05;padding:14px 4px;border-top:1px solid #f2ca69;border-bottom:1px solid #f2ca69;z-index:3;text-shadow:0 3px 12px #000}#intro.fade{opacity:0;transition:opacity .65s;pointer-events:none}@media(prefers-reduced-motion:reduce){#intro.fade{transition:none}}</style></head><body><div id="intro" aria-label="Micke 50 år"><img src="micke-fest.jpg" alt="Micke" onerror="this.style.display='none'"></div><header><h1>MICKE 50 ÅR! 🎉</h1><h2>Välkommen till Mickes 50-årsfest</h2><p>Hjälp Micke att föreviga kvällen!<br>Ta bilder, dela era bästa ögonblick och skapa ett minne för livet.</p><label class="btn" id="cameraLabel">📷 Ta foto<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="btn">🖼️ Välj bilder<input id="files" type="file" accept="image/*" multiple></label><div id="session"><span id="sessionCount"></span><button id="sessionUpload">⬆ Ladda upp foton</button><button id="sessionClear">✕ Rensa val</button></div><br><button id="slideshow">▶ Bildspel</button><p id="status" aria-live="polite"></p><small>Alla uppladdade bilder kan ses av andra med länken. Ladda bara upp bilder du har rätt att dela.</small></header><h2>Festbilderna</h2><div id="gallery"></div><div id="viewer"><button id="close">✕ Stäng</button><img id="large" alt="Festbild"><div id="viewerControls"><button id="pause" style="display:none">⏸ Pausa</button><select id="speed" aria-label="Bildspelshastighet" style="display:none"><option value="3000">3 sek</option><option value="5000" selected>5 sek</option><option value="8000">8 sek</option><option value="12000">12 sek</option></select></div><div id="viewerCount"></div></div><script>setTimeout(()=>{const el=document.getElementById('intro');el.classList.add('fade');setTimeout(()=>el.remove(),700)},2000);const endpoint='https://qcchvqahibb bpijhtwsh.supabase.co'.replace(' ','');const key='sb_publishable_jKuOB0aRCwZlCpVfn3sK5A_jclOM7dT';const bucket='Micke50bilder';const base=endpoint+'/storage/v1';const headers={apikey:key,Authorization:'Bearer '+key};const status=document.getElementById('status');let urls=[],pos=0,timer,playing=false;const preload=new Image();function preloadNext(){if(urls.length>1)preload.src=urls[(pos+1)%urls.length]}function updateCount(){document.getElementById('viewerCount').textContent=urls.length?(pos+1)+' av '+urls.length:''}function startTimer(){clearInterval(timer);if(playing)timer=setInterval(()=>show(pos+1),Number(document.getElementById('speed').value))}async function load(){try{const r=await fetch(base+'/object/list/'+bucket,{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({prefix:'',limit:1000,offset:0,sortBy:{column:'created_at',order:'desc'}})});if(!r.ok)throw Error('Galleriet kan inte hämtas ('+r.status+').');const a=await r.json();if(!Array.isArray(a))throw Error('Ogiltigt svar från bildlagringen.');urls=a.filter(x=>x.name&&!x.name.startsWith('.')).map(x=>base+'/object/public/'+bucket+'/'+encodeURIComponent(x.name));document.getElementById('gallery').replaceChildren(...urls.map((u,i)=>{const img=document.createElement('img');img.src=u;img.loading='lazy';img.alt='Festbild '+(i+1);img.onclick=()=>show(i);return img}));}catch(e){status.textContent='Kunde inte visa bilder: '+e.message}}async function upload(list){let ok=0;for(const f of list){if(!f.type.startsWith('image/'))continue;if(f.size>20*1024*1024){status.textContent=f.name+' är större än 20 MB';continue}status.textContent='Laddar upp '+(ok+1)+' av '+list.length+'…';const name=Date.now()+'-'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');try{const r=await fetch(base+'/object/'+bucket+'/'+encodeURIComponent(name),{method:'POST',headers:{...headers,'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok)throw Error(await r.text());ok++}catch(e){status.textContent='Fel vid uppladdning: '+e.message;return}}status.textContent=ok+' bild(er) sparade. Hämtar galleriet…';await load();if(!urls.length)status.textContent='Bilden har skickats, men galleriet visar inga bilder. Kontakta arrangören.'}document.getElementById('files').onchange=async e=>{const selected=[...e.target.files];e.target.value='';if(selected.length)await upload(selected)};let sessionFiles=[];function sessionUpdate(){document.getElementById('session').style.display=sessionFiles.length?'block':'none';document.getElementById('sessionCount').textContent=sessionFiles.length+' foto(n) redo att laddas upp';document.getElementById('cameraLabel').firstChild.textContent=sessionFiles.length?'📷 Ta nästa foto':'📷 Ta foto'}document.getElementById('camera').onchange=e=>{const selected=[...e.target.files];e.target.value='';sessionFiles.push(...selected.filter(f=>f.type.startsWith('image/')));sessionUpdate()};document.getElementById('sessionClear').onclick=()=>{sessionFiles=[];sessionUpdate()};document.getElementById('sessionUpload').onclick=async()=>{if(!sessionFiles.length)return;const batch=[...sessionFiles];document.getElementById('sessionUpload').disabled=true;try{await upload(batch);sessionFiles=[];sessionUpdate()}finally{document.getElementById('sessionUpload').disabled=false}};const large=document.getElementById('large');function show(i){if(!urls.length)return;pos=(i+urls.length)%urls.length;large.style.transition='none';large.style.transform='translate3d(0,0,0)';large.style.opacity='1';large.src=urls[pos];document.getElementById('viewer').style.display='flex';updateCount();preloadNext();requestAnimationFrame(()=>{large.style.transition=''})}let startX=0,startY=0,tracking=false,swipeLocked=false;const viewer=document.getElementById('viewer');function resetDrag(){tracking=false;large.classList.remove('dragging');large.style.transform='translate3d(0,0,0)';large.style.opacity='1'}viewer.addEventListener('pointerdown',e=>{if(e.target.closest('button,select')||swipeLocked)return;startX=e.clientX;startY=e.clientY;tracking=true;large.classList.add('dragging');if(viewer.setPointerCapture)try{viewer.setPointerCapture(e.pointerId)}catch(_){}},{passive:true});viewer.addEventListener('pointermove',e=>{if(!tracking)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>Math.abs(dy)){large.style.transform='translate3d(0,0,0)';large.style.opacity='1';return}large.style.transform='translate3d(0px,'+dy+'px,0)';large.style.opacity=String(Math.max(.5,1-Math.abs(dy)/800))},{passive:true});viewer.addEventListener('pointerup',e=>{if(!tracking||viewer.style.display!=='flex')return;tracking=false;large.classList.remove('dragging');const dx=e.clientX-startX,dy=e.clientY-startY;const distance=dy;if(Math.abs(distance)<65||Math.abs(dy)<=Math.abs(dx)*1.2||urls.length<2){resetDrag();return}swipeLocked=true;const x=0;const y=distance<0?-innerHeight:innerHeight;large.style.transform='translate3d('+x+'px,'+y+'px,0)';large.style.opacity='0';setTimeout(()=>{show(pos+(distance<0?1:-1));swipeLocked=false;if(playing)startTimer()},200)},{passive:true});viewer.addEventListener('pointercancel',resetDrag);function close(){playing=false;clearInterval(timer);document.getElementById('pause').style.display='none';document.getElementById('speed').style.display='none';document.getElementById('viewer').style.display='none';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}document.getElementById('close').onclick=close;document.getElementById('viewer').onclick=e=>{if(e.target.id==='viewer')close()};document.getElementById('slideshow').onclick=()=>{if(!urls.length){status.textContent='Inga bilder ännu';return}playing=true;document.getElementById('pause').style.display='inline-block';document.getElementById('pause').textContent='⏸ Pausa';document.getElementById('speed').style.display='inline-block';show(0);startTimer();if(viewer.requestFullscreen) viewer.requestFullscreen().catch(()=>{})};document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'⏸ Pausa':'▶ Fortsätt';startTimer()};document.getElementById('speed').onchange=startTimer;load();setInterval(load,15000);</script></body></html>
