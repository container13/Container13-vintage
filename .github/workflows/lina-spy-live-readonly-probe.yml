name: Lina SPY live read-only probe
on:
  push:
    branches:
      - lina-corporate-actions-ci-isolated
    paths:
      - '.github/workflows/lina-spy-live-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only Worker health and narrow SPY history probe
        shell: bash
        env:
          LINA_WORKER_URL: https://linas-opti-api.mangaj73.workers.dev
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, hashlib
          base=os.environ["LINA_WORKER_URL"]
          def request(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"Lina-Gen17-readonly-probe/1"}),timeout=20) as r:
                      return r.status,r.read(1000000)
              except urllib.error.HTTPError as e:
                  return e.code,e.read(100000)
          try:
              code, raw=request("/health")
              print("health HTTP:",code)
              if code==200:
                  h=json.loads(raw)
                  print("health: alpacaConfigured=",h.get("alpacaConfigured"),"tradingEnabled=",h.get("tradingEnabled"))
              path="/bars?symbols=SPY&timeframe=1Day&feed=sip&adjustment=raw&start=2024-12-27&end=2024-12-30"
              code,raw=request(path)
              print("bars HTTP:",code,"response_bytes:",len(raw))
              print("response_sha256:",hashlib.sha256(raw).hexdigest())
              try:
                  d=json.loads(raw)
                  if code==200:
                      rows=d.get("rows",[])
                      print("bars: ok=",d.get("ok"),"feed=",d.get("feed"),"adjustment=",d.get("adjustment"),"rowCount=",d.get("rowCount"),"pages=",d.get("pages"))
                      print("bar dates:",[str(x.get("t",""))[:10] for x in rows[:5]])
                      if not (d.get("ok") and d.get("rowCount",0)>=1 and d.get("feed")=="sip" and d.get("adjustment")=="raw"):
                          raise SystemExit("FAIL: unexpected SPY response metadata")
                  else:
                      print("bars response error type:",d.get("error"),"upstream_status:",d.get("status"))
                      raise SystemExit("BLOCKED: live bars HTTP "+str(code))
              except json.JSONDecodeError:
                  raise SystemExit("FAIL: non-JSON response")
          except Exception as e:
              print("BLOCKED: request exception:",type(e).__name__,str(e)[:180])
              raise SystemExit(1)
          PY
