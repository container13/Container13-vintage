name: Flyg isolated free runtime deploy
on:
  push:
    branches: [flyg-alperna-init]
    paths: ['flyg/server/deploy-request.json']
permissions:
  contents: write
concurrency:
  group: flyg-runtime-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CCC_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CCC_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify evidence, isolated disabled target and tests
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open('flyg/server/hosting-verification.json'))
          assert e['plan']=='Free' and e['priceUSD']==0 and e['currentPlanVisible'] is True
          c=json.load(open('flyg/server/wrangler.jsonc'))
          assert c['name']=='flyg-search-api' and c['main']=='worker.mjs'
          assert c['vars']['FLYG_ENABLED']=='false'
          assert not c.get('routes') and not c.get('route')
          print('PASS user-provided Free current-plan evidence and isolated target')
          PY
          node --test flyg/server/worker.test.mjs
      - name: Deploy disabled isolated Worker
        id: deploy_disabled
        working-directory: flyg/server
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.jsonc
      - name: Inject existing provider secret server-side
        id: inject_secret
        working-directory: flyg/server
        env:
          FLYG_SERPAPI_KEY: ${{ secrets.FLYG_SERPAPI_KEY }}
        run: |
          test -n "$FLYG_SERPAPI_KEY"
          printf '%s' "$FLYG_SERPAPI_KEY" | npx --yes wrangler@4.45.0 secret put FLYG_SERPAPI_KEY --config wrangler.jsonc
      - name: Enable isolated search with persistent quota guards
        id: enable_search
        working-directory: flyg/server
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.jsonc --var FLYG_ENABLED:true
      - name: Check deployed Worker version without provider search (diagnostic only)
        id: health
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          url='https://flyg-search-api.mangaj73.workers.dev/health'
          for attempt in range(3):
            try:
              with urllib.request.urlopen(url,timeout=12) as resp:
                data=json.load(resp)
              assert data.get('version')=='0.1.24',f"Unexpected Worker version: {data.get('version')}"
              assert data.get('enabled') is True,'Worker not enabled'
              assert data.get('configured') is True,'Worker provider secret missing'
              print('PASS isolated Worker 0.1.24 health (zero SerpApi calls)')
              break
            except urllib.error.HTTPError as exc:
              if exc.code==403:
                print('UNVERIFIED: public health endpoint returned HTTP 403 from GitHub runner; deployment CLI succeeded, browser verification required')
                raise
              if attempt==2: raise
            except Exception:
              if attempt==2: raise
            time.sleep(4)
          PY
      - name: Record verification boundary
        run: echo "Deployment CLI stages succeeded; health is a separate diagnostic, not a deployment failure. Browser and iPhone verification required."
      - name: Persist sanitized deployment diagnostics to isolated branch
        if: always()
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
          DEPLOY_COMMIT: ${{ github.sha }}
          STEP_DEPLOY_DISABLED: ${{ steps.deploy_disabled.outcome }}
          STEP_INJECT_SECRET: ${{ steps.inject_secret.outcome }}
          STEP_ENABLE_SEARCH: ${{ steps.enable_search.outcome }}
          STEP_HEALTH: ${{ steps.health.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          report={'sourceCommit':os.environ['DEPLOY_COMMIT'],'jobStatus':os.environ['DEPLOY_JOB_STATUS'],'steps':{'deployDisabled':os.environ['STEP_DEPLOY_DISABLED'],'injectSecret':os.environ['STEP_INJECT_SECRET'],'enableSearch':os.environ['STEP_ENABLE_SEARCH'],'health':os.environ['STEP_HEALTH']},'workerHealth':'UNVERIFIED'}
          try:
            with urllib.request.urlopen('https://flyg-search-api.mangaj73.workers.dev/health',timeout=10) as resp:
              data=json.load(resp)
            report['workerHealth']='PASS' if data.get('version')=='0.1.24' and data.get('enabled') is True and data.get('configured') is True else 'MISMATCH'
            report['workerVersion']=str(data.get('version',''))[:30]
          except urllib.error.HTTPError as e:
            report['workerHealth']='HTTP_'+str(e.code)
          except Exception as e:
            report['workerHealth']='NETWORK_ERROR'
            report['errorType']=type(e).__name__
          with open('flyg/server/deploy-diagnostics.json','w') as out:json.dump(report,out,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyg/server/deploy-diagnostics.json
          git diff --cached --quiet || { git commit -m "Flyg: record sanitized Worker deploy diagnostics"; git push origin HEAD:flyg-alperna-init; }
