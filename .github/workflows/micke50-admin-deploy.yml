name: Deploy Micke50 admin Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - ccc-demo-public-test
    paths:
      - 'supabase/functions/micke50-admin/**'
      - '.github/workflows/micke50-admin-deploy.yml'

permissions:
  contents: read

concurrency:
  group: micke50-admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy PIN-protected function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MICKE50_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing MICKE50_SUPABASE_ACCESS_TOKEN GitHub Actions secret"
            exit 1
          fi
          supabase functions deploy micke50-admin --project-ref qcchvqahibbbpijhtwsh --no-verify-jwt
