name: Audit Lina Worker candidate (no automatic promotion)

on:
  workflow_dispatch:
  push:
    branches:
      - ccc-demo-public-test
    paths:
      - 'linasopti/worker/WORKER_PENDING_RUNTIME_REPORT.js'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccc-demo-public-test
      - name: Validate candidate and preserve verified archives
        shell: bash
        run: |
          set -euo pipefail
          cd linasopti/worker
          test -s WORKER_CURRENT.js
          test -s WORKER_PREVIOUS.js
          test -s WORKER_PENDING_RUNTIME_REPORT.js
          grep -q 'runtime-report-v0321' WORKER_PENDING_RUNTIME_REPORT.js
          node --check WORKER_PENDING_RUNTIME_REPORT.js
          echo 'AUDIT_ONLY: no CURRENT/PREVIOUS rotation.'
          echo 'A candidate can be promoted only after independently evidenced deploy + runtime/client verification.'
          echo 'The archive promotion procedure must be separately approved and verified; this job never writes.'
