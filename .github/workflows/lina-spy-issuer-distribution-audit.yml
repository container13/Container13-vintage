name: Lina SPY issuer distribution audit (read-only)
on:
  push:
    paths:
      - '.github/workflows/lina-spy-issuer-distribution-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch official XLSX and extract SPY 2020-2024 (no credentials)
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,io,zipfile,xml.etree.ElementTree as ET,re,datetime,collections
          url='https://www.ssga.com/library-content/products/fund-data/etfs/us/spdr-etf-historical-distributions.xlsx'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Lina-issuer-research/1'})
          with urllib.request.urlopen(req,timeout=45) as response:
              body=response.read(15000000)
              print('HTTP',response.status,'bytes',len(body),'SHA256',hashlib.sha256(body).hexdigest())
          if not body.startswith(b'PK'): raise SystemExit('FAIL not XLSX')
          z=zipfile.ZipFile(io.BytesIO(body))
          ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          shared=[]
          if 'xl/sharedStrings.xml' in z.namelist():
              root=ET.fromstring(z.read('xl/sharedStrings.xml'))
              shared=[''.join(t.text or '' for t in si.findall('.//m:t',ns)) for si in root.findall('m:si',ns)]
          def decode(c):
              typ=c.get('t')
              if typ=='inlineStr':return ''.join(t.text or '' for t in c.findall('.//m:t',ns))
              v=c.find('m:v',ns)
              if v is None:return ''
              return shared[int(v.text)] if typ=='s' else v.text or ''
          def colnum(ref):
              n=0
              for ch in re.match('[A-Z]+',ref).group():n=n*26+ord(ch)-64
              return n-1
          rows=[]
          for fn in sorted(x for x in z.namelist() if re.fullmatch(r'xl/worksheets/sheet[0-9]+\.xml',x)):
              root=ET.fromstring(z.read(fn))
              for row in root.findall('.//m:sheetData/m:row',ns):
                  cells={colnum(c.get('r')):decode(c).strip() for c in row.findall('m:c',ns)}
                  if cells:rows.append((fn,cells))
          print('workbook_nonempty_rows',len(rows))
          for fn,cells in rows[:5]:print('sample_headers',fn,list(cells.items())[:12])
          hits=[(fn,cells) for fn,cells in rows if any(v.strip().upper()=='SPY' for v in cells.values())]
          print('spy_rows_all_years',len(hits))
          events=[]
          for fn,c in hits:
              try: ex=datetime.datetime.strptime(c[3],'%m/%d/%Y').date()
              except (KeyError,ValueError): continue
              if 2020<=ex.year<=2024: events.append((ex,c.get(6,'')))
          print('SPY_2020_2024_EVENTS',len(events))
          for ex,div in sorted(events): print('SPY_DIVIDEND',ex.isoformat(),div)
          if len(events)!=20: raise SystemExit('FAIL expected 20 events')
          print('PASS issuer event count; Alpaca match not checked')
          import json,urllib.parse
          prices={}
          for mode in ('raw','dividend'):
              params=urllib.parse.urlencode(dict(symbols='SPY',timeframe='1Day',feed='sip',adjustment=mode,start='2020-01-01',end='2024-12-31'))
              req=urllib.request.Request('https://linas-opti-api.mangaj73.workers.dev/bars?'+params,headers={'User-Agent':'Lina-SPY-adjustment-audit/1'})
              with urllib.request.urlopen(req,timeout=90) as response:
                  data=json.load(response)
              if not data.get('ok'):raise SystemExit('FAIL provider response')
              prices[mode]={x['t'][:10]:float(x['c']) for x in data['rows']}
          dates=sorted(set(prices['raw']) & set(prices['dividend']))
          failures=[]
          for ex,amount in events:
              date=ex.isoformat()
              prior=[d for d in dates if d<date]
              if not prior or date not in dates:failures.append(date);continue
              previous=prior[-1]
              ratio_before=prices['dividend'][previous]/prices['raw'][previous]
              ratio_after=prices['dividend'][date]/prices['raw'][date]
              observed=ratio_before/ratio_after
              expected=1-float(amount)/prices['raw'][previous]
              error=abs(observed-expected)
              print('FACTOR_CHECK',date,'error',round(error,8))
              if error>0.0005:failures.append(date)
          print('FACTOR_FAILURES',failures)
          if failures:raise SystemExit('FAIL factor checks')
          print('PASS issuer dividends vs provider factors; event API and PIT not checked')
          for fn,cells in hits[:4]:print('spy_row_sample',fn,list(cells.items())[:12])
          if not hits:raise SystemExit('FAIL SPY rows not found; inspect workbook schema')
          print('PASS issuer workbook downloaded and SPY rows found; historical 2020-2024 parsing and Alpaca event reconciliation NOT YET VERIFIED')
          PY
