name: Flyg free provider proof
on:
  push:
    branches: [flyg-alperna-init]
    paths:
      - 'flyg/probes/request.json'
permissions:
  contents: read
concurrency:
  group: flyg-provider-proof
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify free-plan and secret protection guards
        run: python3 -B -m unittest discover -s flyg/probes -p 'test_*.py'
      - name: Bounded fare details after Free account check
        env:
          FLYG_SERPAPI_KEY: ${{ secrets.FLYG_SERPAPI_KEY }}
        run: python3 -B flyg/probes/serpapi_details.py
