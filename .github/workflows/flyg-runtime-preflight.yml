name: Flyg runtime free hosting preflight
on:
  push:
    branches: [flyg-alperna-init]
    paths: ['flyg/server/preflight-request.json']
permissions:
  contents: read
concurrency:
  group: flyg-runtime-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify existing hosting access and zero-cost account (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CCC_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CCC_CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -B flyg/server/preflight.py
