name: Lina Corporate Actions isolated Miniflare CI
on:
  push:
    branches:
      - lina-corporate-actions-ci-isolated
    paths:
      - '.github/workflows/lina-corporate-actions-isolated.yml'
      - 'linasopti/ci-corporate-actions/**'
      - 'linasopti/version.js'
      - 'linasopti/index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline-worker-test:
    if: github.ref == 'refs/heads/lina-corporate-actions-ci-isolated'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies (no scripts)
        working-directory: linasopti/ci-corporate-actions
        run: npm install --no-save --no-package-lock --ignore-scripts miniflare esbuild
      - name: Run isolated documented schema fixture check
        run: node linasopti/ci-corporate-actions/schema-fixtures-test.mjs
      - name: Check V4 candidate bundle
        run: bash linasopti/ci-corporate-actions/cloudflare-prebuild.sh
      - name: Stage exact generated bundle for verification (isolated branch only)
        run: cp linasopti/ci-corporate-actions/.candidate-build/WORKER_V4_RELEASE_CANDIDATE.js linasopti/worker/WORKER_V046_PREBUNDLED.js
      - name: Test exact bundled Worker offline
        run: node linasopti/ci-corporate-actions/miniflare-test.mjs
      - name: Wrangler staging SHA check
        run: node linasopti/ci-corporate-actions/verify-wrangler-staging.mjs
      - name: Wrangler packaging dry-run (no deploy)
        working-directory: linasopti/worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir ../ci-corporate-actions/.candidate-build/wrangler-dryrun
      - name: Check isolated V046 candidate gate
        run: node linasopti/ci-corporate-actions/check-v046-candidate.mjs
      - name: Archive tested V046 Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: lina-v046-tested-worker
          path: linasopti/ci-corporate-actions/.candidate-build/WORKER_V4_RELEASE_CANDIDATE.js
          if-no-files-found: error
          retention-days: 30
      - name: Commit exact tested Worker on isolated branch
        if: github.ref == 'refs/heads/lina-corporate-actions-ci-isolated'
        run: |
          cp linasopti/ci-corporate-actions/.candidate-build/WORKER_V4_RELEASE_CANDIDATE.js linasopti/worker/WORKER_V046_PREBUNDLED.js
          git add -f linasopti/worker/WORKER_V046_PREBUNDLED.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store tested V046 Worker on isolated branch'
            git push origin HEAD:lina-corporate-actions-ci-isolated
          fi
      - name: Assert full release gate rejects unpublished candidate
        run: |
          python3 linasopti/tools/release_integrity.py > /tmp/lina-release-gate.json && exit 1 || code=$?
          test "$code" -eq 1
          python3 -c 'import json; j=json.load(open("/tmp/lina-release-gate.json")); assert j["status"]=="FAIL"; assert j["failed"]==["current_state_release"],j["failed"]; assert next(c for c in j["checks"] if c["id"]=="worker_source_explicit")["pass"]; print("PASS expected live-release guard; reviewed Worker source PASS")'
      - name: Confirm deployment remains blocked
        run: echo 'Candidate-only PASS. Production release integrity is separate and remains required before deploy.'
