name: Deploy CCC Vision PENDING test

on:
  push:
    branches: [ccc-demo-public-test]
    paths:
      - 'ccc-core/vision/WORKER_PENDING.js'
      - '.github/workflows/ccc-vision-pending-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccc-vision-pending-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate syntax
        run: node --check ccc-core/vision/WORKER_PENDING.js
      - name: Check dedicated Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CCC_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CCC_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CCC Cloudflare token"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CCC Cloudflare account"; exit 1; }
      - name: Deploy isolated candidate Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CCC_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CCC_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ccc-core/vision
          command: deploy WORKER_PENDING.js --name ccc-vision-pending-test --compatibility-date 2026-10-08
      - name: Explain required translation secret
        run: |
          echo "PENDING translation requires its own OPENAI_API_KEY secret in Cloudflare Worker settings."
          echo "GitHub deploy credentials do not grant OpenAI access."
          echo "Do not report bilingual AI as ready until a real translation POST passes."
      - name: Smoke test isolated Worker HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ccc-vision-pending-test.mangaj73.workers.dev/"
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/ccc-vision-get.txt -w '%{http_code}' --max-time 15 "$URL" || true)
            if [ "$status" = "405" ]; then break; fi
            echo "GET attempt $attempt returned $status; retrying"
            sleep 5
          done
          test "$status" = "405" || { echo "Expected GET 405, got $status"; exit 1; }
          options=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X OPTIONS -H 'Origin: https://container13.se' "$URL")
          test "$options" = "204" || { echo "Expected OPTIONS 204, got $options"; exit 1; }
          echo "Isolated Worker HTTP smoke test PASS (GET 405, OPTIONS 204). AI not tested."
      - name: Explain candidate limits
        run: |
          echo "PENDING deployed under ccc-vision-pending-test; production ccc-vision-api untouched."
          echo "This job does not copy production OPENAI_API_KEY secret into test Worker."
          echo "No live AI runtime PASS or promotion is implied."
          echo "Translation cannot be declared ready without a configured PENDING OPENAI_API_KEY and a successful translation test."
