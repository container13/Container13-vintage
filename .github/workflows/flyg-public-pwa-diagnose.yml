name: Flyg public PWA read-only version and journey smoke
on:
  push:
    branches: [flyg-alperna-init]
    paths: ['.github/workflows/flyg-public-pwa-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install browser
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Probe published 0.1.38 and St Anton without API searches
        run: |
          python3 - <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          target='https://container13.se/flyg/'
          expected='0.1.38'
          result={'target':target,'expectedVersion':expected,'providerSearches':0}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            context=browser.new_context(service_workers='allow')
            page=context.new_page()
            errors=[]
            page.on('pageerror',lambda e:errors.append(str(e)[:240]))
            for attempt in range(5):
              response=page.goto(target,wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(1000)
              version=page.evaluate('window.ProjectVersion?.release || null')
              r=context.request.get(target+'release.json?smoke=0138-'+str(attempt),headers={'Cache-Control':'no-cache'},timeout=15000)
              info=r.json() if r.ok else {}
              result.update({'pageHttp':response.status if response else None,'clientVersion':version,'manifestVersion':info.get('release'),'manifestHttp':r.status})
              if response and response.status==200 and version==expected and r.status==200 and info.get('release')==expected:break
              time.sleep(2)
            result['roadCheck']=page.evaluate("""() => {
              const req={resort:'St. Anton am Arlberg',transport:'road',dinnerTarget:'20:00',hotelCutoff:'22:00',airportMinutes:60,roadBufferMinutes:30,checkinMinutes:30};
              const codes={INN:75,ZRH:135,MUC:195,FDH:100};
              return Object.fromEntries(Object.entries(codes).map(([code,want])=>{
                const a=window.FlygJourney?.resortArrival({segments:[{destination:code,arrivalLocal:'2027-03-14 12:00'}]},req);
                return [code,{actual:a?.roadMinutes,estimated:a?.verification==='ESTIMATE_ONLY',pass:a?.roadMinutes===want&&a?.verification==='ESTIMATE_ONLY'}];
              }));
            }""")
            result['unknownCity']=page.evaluate("""() => {
              const req={resort:'St. Anton am Arlberg',transport:'road',dinnerTarget:'20:00',hotelCutoff:'22:00',airportMinutes:60,roadBufferMinutes:30,checkinMinutes:30,returnPlan:'city',maxNights:5,skiDays:3,skiStart:'09:00',skiEnd:'16:00',earliestHotelDeparture:'07:00',earliestCityDeparture:'05:00',airportReturnMinutes:120,cityAirportMinutes:90};
              const out={segments:[{origin:'ARN',destination:'INN',departureLocal:'2027-03-14 07:00',arrivalLocal:'2027-03-14 12:00'}]};
              const back={segments:[{origin:'INN',destination:'ARN',departureLocal:'2027-03-18 14:00',arrivalLocal:'2027-03-18 18:00'}]};
              return window.FlygJourney?.skiTrip(out,back,req).status;
            }""")
            result['pageErrors']=errors
            browser.close()
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['pageHttp']==200 and result['clientVersion']==expected and result['manifestHttp']==200 and result['manifestVersion']==expected,'Live CDN/version mismatch'
          assert all(x['pass'] for x in result['roadCheck'].values()),'St Anton road-time mismatch'
          assert result['unknownCity']=='UNKNOWN','Unverified city night must stay UNKNOWN'
          assert not result['pageErrors'],'Browser JavaScript errors'
          print('PASS: published version and St Anton modelling; ZERO provider API calls')
          PY
