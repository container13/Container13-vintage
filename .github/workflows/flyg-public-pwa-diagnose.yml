name: Flyg public PWA update diagnosis
on:
  push:
    branches: [flyg-alperna-init]
    paths: ['.github/workflows/flyg-public-pwa-diagnose.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Inspect live CDN and service worker in browser
        run: |
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          out={'target':'https://container13.se/flyg/','expected':'0.1.24'}
          try:
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(service_workers='allow')
              page=context.new_page()
              page.on('console',lambda m:out.setdefault('console',[]).append(m.text[:200]) if m.type=='error' else None)
              page.on('pageerror',lambda e:out.setdefault('pageErrors',[]).append(str(e)[:200]))
              response=page.goto(out['target'],wait_until='domcontentloaded',timeout=25000)
              out['pageHttp']=response.status if response else None
              page.wait_for_timeout(3000)
              out['clientVersion']=page.evaluate('window.ProjectVersion?.release || null')
              out['sw']=page.evaluate("""async()=>{let r=await navigator.serviceWorker.getRegistration();if(!r)return null;try{await r.update()}catch(e){return {updateError:String(e)}};await new Promise(r=>setTimeout(r,3000));return {active:r.active?.state,waiting:r.waiting?.state,installing:r.installing?.state,controller:!!navigator.serviceWorker.controller}}""")
              for name in ['release.json','version.js','sw.js']:
                try:
                  r=page.request.get(out['target']+name+'?diagnostic=20261114',timeout=15000)
                  body=r.text()
                  out[name]={'http':r.status,'snippet':body[:220] if name!='sw.js' else body[:85]}
                except Exception as e:out[name]={'error':type(e).__name__}
              browser.close()
          except Exception as e:out['probeError']=type(e).__name__
          with open('flyg/public-pwa-diagnostics.json','w') as f:json.dump(out,f,indent=2,ensure_ascii=False)
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Save diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyg/public-pwa-diagnostics.json
          git diff --cached --quiet || { git commit -m "Flyg: record public PWA cache diagnosis"; git push origin HEAD:flyg-alperna-init; }
