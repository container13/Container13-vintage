name: Flyg scoped frontend promotion 0.1.25
on:
  push:
    branches: [flyg-alperna-init]
    paths: ['.github/workflows/flyg-frontend-promote-0125.yml']
permissions:
  contents: write
concurrency:
  group: flyg-frontend-promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify browser Worker PASS and release integrity
        run: |
          python3 - <<'PY'
          import json,re,hashlib,pathlib
          b=json.load(open('flyg/server/browser-smoke-diagnostics.json'))
          assert b['browserHealth']=='PASS' and b['httpStatus']==200 and b['reportedVersion']=='0.1.24'
          r=json.load(open('flyg/release.json'))
          assert r['release']=='0.1.25'
          v=pathlib.Path('flyg/version.js').read_text()
          assert "RELEASE='0.1.25'" in v
          sw=pathlib.Path('flyg/sw.js').read_text()
          hashes=json.loads(re.search(r'const INTEGRITY=(\{[^;]+\});',sw).group(1))
          for key,digest in hashes.items():
            path=pathlib.Path('flyg')/('index.html' if key=='./' else key)
            assert path.is_file(),str(path)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,str(path)
          print('PASS 16 asset SHA256 checks, Worker Chromium 0.1.24 PASS (API unchanged)')
          PY
          node --check flyg/app.js
          node --check flyg/live-search.js
          node --check flyg/selection-feedback.js
          node --check flyg/sw.js
          node --test flyg/server/worker.test.mjs
      - name: Promote only Flyg frontend assets to existing Pages branch
        run: |
          set -euo pipefail
          git worktree add /tmp/flyg-public origin/ccc-demo-public-test
          cd /tmp/flyg-public
          git switch -c flyg-promote-0125
          assets=(index.html style.css app.js live-search.js selection-feedback.js journey-engine.js version.js auto-update.js pwa.js sw.js manifest.webmanifest release.json assets/flyg-icon-180.png assets/flyg-icon-192.png assets/flyg-icon-512.png assets/flyg-icon-1024.png)
          for asset in "${assets[@]}"; do
            mkdir -p "flyg/$(dirname "$asset")"
            cp "$GITHUB_WORKSPACE/flyg/$asset" "flyg/$asset"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- flyg/
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          if git diff --cached --name-only | grep -qv '^flyg/'; then echo 'Non-Flyg changes detected'; exit 1; fi
          git commit -m "Flyg: promote verified server-compatible frontend 0.1.25"
          git push origin HEAD:ccc-demo-public-test
      - name: Verify public version without provider search
        id: public
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request,time
          url='https://container13.se/flyg/version.js?_flyg_verify=0125'
          for i in range(8):
            try:
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=12) as response:s=response.read().decode()
              if "RELEASE='0.1.25'" in s:
                print('PASS public version.js 0.1.25');break
              print('Public CDN not yet 0.1.25')
            except Exception as e:print('Public verification unavailable:',type(e).__name__)
            if i==7:raise SystemExit('Public version not verified')
            time.sleep(10)
          PY
