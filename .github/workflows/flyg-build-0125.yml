name: Flyg candidate integrity and branch drift guard
on:
  push:
    branches: [flyg-alperna-init]
    paths:
      - 'flyg/**'
      - '.github/workflows/flyg-build-0125.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flyg-candidate-integrity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify version, SHA256 assets, and static JavaScript
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('flyg')
          v=re.search(r"RELEASE='([^']+)'",(root/'version.js').read_text()).group(1)
          release=json.loads((root/'release.json').read_text())['release']
          sw=(root/'sw.js').read_text()
          cache=re.search(r"const CACHE='flyg-shell-([^']+)'",sw).group(1)
          assert v==release==cache,(v,release,cache)
          assert 'window.ProjectVersion?.release' in (root/'index.html').read_text()
          hashes=json.loads(re.search(r'const INTEGRITY=(\{[^;]+\});',sw).group(1))
          assert len(hashes)==16,len(hashes)
          for key,digest in hashes.items():
            path=root/('index.html' if key=='./' else key)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,key
          print('PASS version, runtime footer, 16 asset digests')
          PY
          node --check flyg/sw.js
          node --check flyg/app.js
          node --check flyg/auto-update.js
          node --check flyg/pwa.js
          node --test flyg/server/worker.test.mjs
      - name: Verify production drift (read-only)
        run: |
          git fetch --no-tags origin ccc-demo-public-test
          for path in flyg/index.html flyg/version.js flyg/release.json flyg/sw.js; do
            test "$(git hash-object "$path")" = "$(git rev-parse "FETCH_HEAD:$path")" || { echo "FAIL branch drift: $path"; exit 1; }
          done
          echo 'PASS critical release assets identical in development and production'
