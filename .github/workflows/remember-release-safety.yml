name: Remember release safety
on:
  push:
    branches: [ccc-demo-public-test]
    paths: ['remember/**', '.github/workflows/remember-release-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify existing rollback branches (read-only)
        run: |
          set -euo pipefail
          for ref in remember/snapshot-0.1.107-unverified remember/snapshot-0.1.108-unverified; do
            git ls-remote --exit-code --heads origin "refs/heads/$ref" >/dev/null || {
              echo "::error::Rollback branch missing: $ref"
              exit 1
            }
            echo "Rollback branch present: $ref"
          done
          echo "::notice::Branch snapshots verified. Each push also uploads a 90-day rollback artifact; permanent automatic Git ref snapshots remain unavailable."
      - name: Upload immutable rollback bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: remember-rollback-${{ github.sha }}
          path: |
            remember/
            .github/workflows/remember-release-safety.yml
          retention-days: 90
          if-no-files-found: error
      - name: Restore archive in isolated temporary directory
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          name: remember-rollback-${{ github.sha }}
          path: ${{ runner.temp }}/remember-restore-test
      - name: Verify restored files match original
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,sys
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'remember-restore-test'
          source=pathlib.Path('remember')
          restored=base/'remember'
          if not restored.is_dir():
              print('::error::Restored remember directory is missing')
              sys.exit(1)
          files=[p for p in source.rglob('*') if p.is_file() and '.git' not in p.parts]
          mismatches=[]
          for p in files:
              other=restored/p.relative_to(source)
              if not other.is_file() or hashlib.sha256(p.read_bytes()).digest()!=hashlib.sha256(other.read_bytes()).digest():
                  mismatches.append(str(p))
          workflow=pathlib.Path('.github/workflows/remember-release-safety.yml')
          recovered=base/workflow
          if not recovered.is_file() or workflow.read_bytes()!=recovered.read_bytes():
              mismatches.append(str(workflow))
          if mismatches:
              print('::error::Rollback archive mismatch: '+', '.join(mismatches[:20]))
              sys.exit(1)
          print(f'RESTORE PASS: {len(files)} Remember files and workflow verified byte-for-byte in isolated directory')
          PY
      - name: Validate release consistency
        run: |
          python3 - <<'PY'
          import json,pathlib,re,sys
          root=pathlib.Path('remember')
          state=json.loads((root/'PROJECT_CURRENT_STATE.json').read_text())
          manifest=json.loads((root/'release.json').read_text())
          release=state['release']
          version=manifest['version']
          errors=[]
          if release.get('candidate') != version: errors.append('Candidate must match release.json')
          if not release.get('integrity'): errors.append('Release integrity status missing')
          if manifest.get('release') != 'remember-'+version: errors.append('Manifest release identity mismatch')
          if not re.fullmatch(r'\d+\.\d+\.\d+',version): errors.append('Invalid semantic version')
          for name in ('currentVerified','previousVerified'):
              value=release.get(name)
              if value is not None and not isinstance(value,(dict,str)): errors.append(name+' has invalid type')
          index=(root/'index.html').read_text()
          if 'remember-'+version not in index: errors.append('Landing page release identity mismatch')
          if version not in (root/'remember-version.js').read_text(): errors.append('Shared version fallback mismatch')
          if errors:
              print('RELEASE SAFETY FAILED: '+'; '.join(errors))
              sys.exit(1)
          print('Release consistency PASS; verified CURRENT/PREVIOUS are not invented.')
          PY
