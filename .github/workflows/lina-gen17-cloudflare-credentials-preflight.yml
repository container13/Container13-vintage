name: Lina Gen17 Cloudflare staging credential preflight (NO DEPLOY)

on:
  push:
    branches: [ccc-demo-public-test]
    paths:
      - '.github/workflows/lina-gen17-cloudflare-credentials-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccc-demo-public-test
      - name: Assert exact staging target and production isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('linasopti/worker')
          staging=json.loads((p/'wrangler.gen17-sse-staging.jsonc').read_text())
          production=json.loads((p/'wrangler.jsonc').read_text())
          assert staging['name']=='linas-opti-gen17-sse-staging'
          assert staging['main']=='./WORKER_GEN17_SSE_CANDIDATE.mjs'
          assert staging.get('workers_dev') is True
          assert production['name']=='linas-opti-api'
          assert production['main']=='./WORKER_V046_PREBUNDLED.js'
          print('PASS: isolated staging name, entry and production name verified.')
          PY
      - name: Check whether existing Cloudflare GitHub secrets are available (no values printed)
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CCC_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CCC_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$CF_API_TOKEN" ]]; then echo 'CCC_CLOUDFLARE_API_TOKEN: PRESENT'; else echo 'CCC_CLOUDFLARE_API_TOKEN: MISSING'; fi
          if [[ -n "$CF_ACCOUNT_ID" ]]; then echo 'CCC_CLOUDFLARE_ACCOUNT_ID: PRESENT'; else echo 'CCC_CLOUDFLARE_ACCOUNT_ID: MISSING'; fi
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          echo 'PREFLIGHT PASS: secret references resolve; token validity/scope NOT verified.'
      - name: Wrangler dry-run (no deployment)
        working-directory: linasopti/worker
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.gen17-sse-staging.jsonc --outdir /tmp/lina-gen17-staging-preflight
