name: Flyg bounded runtime smoke
on:
  push:
    branches: [flyg-alperna-init]
    paths: ['flyg/server/smoke-request.json']
permissions:
  contents: read
concurrency:
  group: flyg-runtime-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Bounded staged runtime check (maximum three search requests)
        run: python3 -B flyg/server/smoke.py
