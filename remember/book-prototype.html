<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Remember – Test D böjbart blad</title><style>
*{box-sizing:border-box}html{background:#10271e;color:#f6f0e8;font-family:system-ui,-apple-system,sans-serif}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 10px;background:radial-gradient(ellipse at 50% 30%,#36563e,#10271e 75%)}h1{font:400 clamp(38px,10vw,60px) Georgia,serif;margin:0}.note{text-align:center;max-width:460px;line-height:1.45;margin:0}#scene{perspective:1700px;width:min(43vw,310px);aspect-ratio:320/380;touch-action:pan-y;transform:translateX(50%)}#book{position:relative;width:100%;height:100%;transform-style:preserve-3d}#book:before{content:"";position:absolute;inset:0;border-radius:7px;background:#d9c9ab;box-shadow:0 16px 30px #0005;transform:translateZ(-4px)}.offer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center;background:#eee3ce;color:#234437;padding:20px}.offer strong{font:400 35px Georgia,serif}.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;pointer-events:none;z-index:calc(20 - var(--i))}.sheet.turned{z-index:calc(30 + var(--i))}.segment{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;will-change:transform}.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px;background:#eee3ce;border:1px solid #c6b89d;border-radius:3px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:inset 0 0 12px #0001}.face.back{transform:rotateY(180deg)}.face img{display:block;width:100%;flex:1;min-height:0;object-fit:cover;border-radius:3px}.face span{display:grid;place-items:center;min-height:42px;color:#234437;font-weight:600;font-size:15px;text-align:center}.controls{display:flex;gap:12px}.controls button{background:#254b37;border:1px solid #8ca793;border-radius:12px;padding:12px 17px;color:white;font-size:16px}small{text-align:center;color:#d1ded2;max-width:440px;line-height:1.5}
</style></head><body><h1>Remember.</h1><p class="note">Test D – bladet består av flera sammanhängande 3D-remsor som böjs under sidvändningen. Slumpmässig höjd påverkar böjningen, inte bara en dekoration.</p><div id="scene"><div id="book"><div class="offer"><strong>10 bilder gratis</strong><span>Gäster behöver inget konto</span><span>Era minnen, tillsammans ♡</span></div></div></div><div class="controls"><button id="prev" type="button">← Föregående</button><button id="next" type="button">Nästa →</button></div><small id="status" role="status">Test D · 0 av 4 blad vända</small><script>
const photos=[{"front":"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&amp;q=80","frontLabel":"Fester & födelsedagar","back":"https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=800&amp;q=80","backLabel":"Festljus"},{"front":"https://images.unsplash.com/photo-1597956959732-9b8cb12f8960?w=800&amp;q=80","frontLabel":"Fiskeresor","back":"https://images.unsplash.com/photo-1473448912268-2022ce9509d8?w=800&amp;q=80","backLabel":"Vatten & stillhet"},{"front":"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&amp;q=80","frontLabel":"Resor & äventyr","back":"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&amp;q=80","backLabel":"Skog & natur"},{"front":"https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=800&amp;q=80","frontLabel":"Bröllop","back":"https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=800&amp;q=80","backLabel":"Blommor & detaljer"}],book=document.getElementById('book'),status=document.getElementById('status');const SEGMENTS=12,DURATION=1150;let index=0,busy=false,timer=null,holdUntil=0,raf=null;const sheets=[];
for(let i=0;i<photos.length;i++){const p=photos[i],sheet=document.createElement('div');sheet.className='sheet';sheet.style.setProperty('--i',i);const segs=[];for(let j=0;j<SEGMENTS;j++){const segment=document.createElement('div');segment.className='segment';segment.style.clipPath='inset(0 '+(100-(j+1)*100/SEGMENTS)+'% 0 '+(j*100/SEGMENTS)+'%)';for(const [side,url,label] of [['front',p.front,p.frontLabel],['back',p.back,p.backLabel]]){const face=document.createElement('div');face.className='face '+side;face.innerHTML='<img src="'+url+'" alt="'+label+'"><span>'+label+'</span>';segment.appendChild(face)}sheet.appendChild(segment);segs.push(segment)}book.appendChild(sheet);sheets.push({sheet,segs})}
function shape(item,progress,origin){const angle=-180*progress;const swell=Math.sin(Math.PI*progress);item.segs.forEach((segment,j)=>{const x=(j+.5)/SEGMENTS;const wave=Math.sin(Math.PI*x);const bend=19*swell*wave*(.65+.35*Math.cos((origin-.5)*Math.PI));const localAngle=angle+bend*Math.cos(2*Math.PI*x);const vertical= (origin-.5)*12*swell*wave;segment.style.transform='translateZ('+ (12*swell*wave).toFixed(2)+'px) rotateY('+localAngle.toFixed(2)+'deg) rotateX('+vertical.toFixed(2)+'deg)';})}
function render(){sheets.forEach((item,i)=>{item.sheet.classList.toggle('turned',i<index);shape(item,i<index?1:0,.5)});status.textContent='Test D · '+index+' av '+sheets.length+' blad vända'}
function schedule(){clearTimeout(timer);if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;timer=setTimeout(()=>{if(Date.now()<holdUntil){schedule();return}turn(1)},2800)}
function turn(dir,manual=false){if(busy)return;if(manual){holdUntil=Date.now()+5000;clearTimeout(timer)}const next=index+dir;if(next<0||next>sheets.length){if(!manual&&index===sheets.length){index=0;render();schedule()}return}busy=true;const item=sheets[dir>0?index:next],start=dir>0?0:1,end=dir>0?1:0,origin=.15+Math.random()*.7;item.sheet.style.zIndex='50';const begin=performance.now();status.textContent='Test D · böjning startar vid '+Math.round(origin*100)+'% av ytterkanten';function frame(now){const t=Math.min(1,(now-begin)/DURATION),e=t*t*(3-2*t);shape(item,start+(end-start)*e,origin);if(t<1){raf=requestAnimationFrame(frame)}else{item.sheet.style.zIndex='';index=next;busy=false;render();status.textContent+=' · start '+Math.round(origin*100)+'%';schedule()}}raf=requestAnimationFrame(frame)}
document.getElementById('next').onclick=()=>turn(1,true);document.getElementById('prev').onclick=()=>turn(-1,true);document.addEventListener('visibilitychange',schedule);let touchX=0;document.getElementById('scene').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});document.getElementById('scene').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>35)turn(d<0?1:-1,true)},{passive:true});render();schedule();
</script></body></html>
