<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Remember – sidvändningstest 0.1.114</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10271e;color:#f3f0e8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;gap:18px;background:radial-gradient(ellipse at 50% 30%,#34513a,#10271e 75%)}
h1{font:400 clamp(36px,9vw,64px) Georgia,serif;margin:0}.note{max-width:540px;text-align:center;line-height:1.5;color:#d8e3d8;margin:0}
#stage{width:min(94vw,480px);min-height:420px;display:grid;place-items:center;touch-action:pan-y}
#book{width:320px;height:400px}
.page{background:#e8dec9;color:#302a22;border:1px solid #c9bda7;overflow:hidden;display:flex;flex-direction:column;padding:10px}
.page img{width:100%;height:83%;object-fit:cover;border-radius:4px}
.page .caption{font:600 16px/1.4 system-ui;text-align:center;padding:8px 3px}
.page.offer{align-items:center;justify-content:center;gap:20px;text-align:center;padding:22px;background:#e8dec9;color:#234437}
.page.offer strong{font:400 35px Georgia,serif}
.controls{display:flex;gap:12px}.controls button{border:1px solid #8ca793;border-radius:12px;background:#254b37;color:white;font-size:16px;padding:12px 18px;cursor:pointer}
small{color:#bdcabc;text-align:center}
</style>
</head>
<body>
<h1>Remember.</h1>
<p class="note">Separat prototyp för naturlig sidvändning. Dra i ett hörn eller svep över boken. Den här sidan ersätter inte startsidan.</p>
<div id="stage"><div id="book">
<div class="page"><img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&q=80" alt="Fest"><div class="caption">Fester & födelsedagar</div></div>
<div class="page"><img src="https://images.unsplash.com/photo-1597956959732-9b8cb12f8960?w=800&q=80" alt="Fisketur"><div class="caption">Fiskeresor</div></div>
<div class="page"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80" alt="Vandring"><div class="caption">Resor & äventyr</div></div>
<div class="page"><img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=800&q=80" alt="Bröllop"><div class="caption">Bröllop</div></div>
<div class="page offer"><strong>10 bilder gratis</strong><span>Gäster behöver inget konto</span><span>Era minnen, tillsammans ♡</span></div>
</div></div>
<div class="controls"><button id="prev" type="button">← Föregående</button><button id="next" type="button">Nästa →</button></div>
<small id="status" role="status">Laddar sidvändningsmotor…</small>
<script type="module">
const status=document.getElementById('status');
try{
 const {PageFlip}=await import('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.module.js');
 const host=document.getElementById('book');
 const flip=new PageFlip(host,{width:320,height:400,size:'stretch',minWidth:240,maxWidth:460,minHeight:300,maxHeight:575,drawShadow:true,maxShadowOpacity:0.18,flippingTime:900,usePortrait:true,startZIndex:0,autoSize:true,showCover:false,mobileScrollSupport:false,swipeDistance:25,clickEventForward:false});
 flip.loadFromHTML(host.querySelectorAll('.page'));
 document.getElementById('prev').addEventListener('click',()=>flip.flipPrev());
 document.getElementById('next').addEventListener('click',()=>flip.flipNext());
 status.textContent='Testmotor laddad · prototyp 0.1.114';
}catch(error){status.textContent='Kunde inte ladda testmotorn. Kontrollera nätverket och prova igen.';console.error('Remember page-flip prototype',error)}
</script>
</body></html>
