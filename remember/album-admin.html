<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Remember – hantera album</title><style>body{font:16px/1.5 system-ui;background:#10231f;color:#f6f3e9;margin:0;padding:30px 18px}main{max-width:640px;margin:auto}a{color:#d9e7a4}input{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:10px 0;border-radius:10px}#qr{background:white;display:inline-block;margin:12px 0}#qr svg{display:block;max-width:75vw;height:auto}button{font:inherit;padding:12px;border-radius:10px;background:#d9e7a4;border:0}p{overflow-wrap:anywhere}[hidden]{display:none!important}.primary-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.primary-actions button{min-height:70px;font-weight:750;font-size:17px;cursor:pointer}.secondary{background:#19352d;color:#f6f3e9;border:1px solid #527b69}details{border-top:1px solid #527b69;padding-top:18px;margin-top:22px}summary{cursor:pointer;font-weight:700}#cameraFrame{width:100%;height:75dvh;border:0;background:#10231f}#cameraHost{position:fixed;inset:0;z-index:9999;margin:0;background:#10231f;display:flex;flex-direction:column}#cameraHost[hidden]{display:none!important}#closeCamera{flex:none;border-radius:0;min-height:48px;text-align:left}#cameraFrame{flex:1;height:auto;min-height:0;width:100%;border:0} @media(max-width:420px){.primary-actions{grid-template-columns:1fr}}.mode-banner{position:sticky;top:0;z-index:20;background:#ffe29a;color:#33210a;border:3px solid #d28b20;border-radius:12px;padding:13px 16px;margin-bottom:20px;font-size:18px;font-weight:900;box-shadow:0 5px 18px #0005}.mode-banner small{display:block;font-size:13px;font-weight:650}.remember-gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.remember-gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.remember-gallery-viewer{position:fixed;inset:0;z-index:10000;background:#000e;display:flex;align-items:center;justify-content:center;padding:14px}.remember-gallery-viewer[hidden]{display:none}.remember-gallery-viewer img{max-width:96vw;max-height:88dvh;object-fit:contain}.remember-gallery-viewer button{position:absolute;top:14px;right:14px;z-index:1;background:#d9e7a4;color:#10231f;border:0;border-radius:8px;padding:10px}@media(min-width:650px){.remember-gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><div class="mode-banner" role="status">🛠 WEBMASTERLÄGE<small>Administration – inte gästvyn · Version WM-9.3</small></div><p><a href="./dashboard.html">← Dashboard</a></p><h1 id="title">Öppnar album…</h1><p id="status" role="status">Kontrollerar webmasteråtkomst.</p><p id="detail"></p><section id="albumActions" hidden><div class="primary-actions"><button id="ownerCamera" type="button">📷 Ta foto</button><button id="ownerFiles" class="secondary" type="button">🖼️ Lägg till bilder</button></div><div id="ownerFeedback" role="status" aria-live="polite"></div><button id="ownerRetry" type="button" hidden>Försök ladda upp igen</button><div id="cameraHost" hidden><button id="closeCamera" type="button">← Tillbaka till albumet</button><iframe id="cameraFrame" title="Remember kamera" allow="camera"></iframe></div><div id="fileHost" hidden><input id="ownerFileInput" type="file" accept="image/*" multiple><p id="fileFeedback"></p></div></section><section id="rememberGallery" hidden></section><section id="sharing" hidden><details><summary>Delning och QR-kod</summary><h2>Gästlänk</h2><p>En redan utfärdad gästlänk kan användas utan inloggning. Befintlig token kan av säkerhetsskäl inte läsas tillbaka från servern.</p><label for="guestLink">Klistra in befintlig gästlänk eller token</label><input id="guestLink" type="text" autocomplete="off" spellcheck="false" placeholder="Befintlig gästlänk eller token"><button id="showGuest" type="button">Visa QR-kod</button><p id="shareStatus" role="status"></p><div id="qr"></div><button id="copyGuest" type="button" hidden>Kopiera gästlänk</button><button id="rememberGuest" type="button" hidden>Kom ihåg på denna enhet</button><button id="forgetGuest" type="button" hidden>Glöm sparad gästlänk</button></details></section></main><script type="module">
import { prepareRememberUpload } from './upload-prepare.js';
import { mountRememberGallery } from './photo-gallery.js?v=1';
const title=document.getElementById('title'),status=document.getElementById('status'),detail=document.getElementById('detail');
const id=new URLSearchParams(location.search).get('id');
if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||'')){title.textContent='Ogiltigt album';status.textContent='Album-ID saknas.';}
else try{
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
 const url='https://wykvztfmfbboxiqvuvwr.supabase.co',key='sb_publishable_qOSBb7U6TGnPQ8ypyYRLGg_GtYrraoG';
 const client=createClient(url,key,{auth:{storage:localStorage,storageKey:'container13-remember-auth-v2',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const {data,error}=await client.auth.getSession();
 if(error||!data.session){location.replace('./login.html');}
 else {
  const response=await fetch(url+'/functions/v1/remember-webmaster',{method:'POST',headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({action:'list'}),cache:'no-store'});
  const body=await response.json();
  if(!response.ok||body.authorized!==true){title.textContent='Åtkomst nekad';status.textContent='Du saknar webmasterbehörighet.';}
  else {
   const album=Array.isArray(body.albums)?body.albums.find(a=>a.id===id):null;
   if(!album){title.textContent='Albumet hittades inte';status.textContent='Albumet finns inte i din behöriga albumlista.';}
   else {title.textContent=album.title||'Album';status.textContent='Albumet är öppnat i webmasterläge.';detail.textContent='Välj vad du vill göra i albumet.';document.getElementById('albumActions').hidden=false;document.getElementById('sharing').hidden=false;}
  }
 }
}catch{title.textContent='Kunde inte öppna albumet';status.textContent='Anslutningen misslyckades. Försök igen senare.'}
const rememberGallery=mountRememberGallery({container:document.getElementById('rememberGallery'),auth:async()=>({albumId:id,bearer:await webmasterSession()})});
document.getElementById('rememberGallery').hidden=false;
const cameraHost=document.getElementById('cameraHost'),cameraFrame=document.getElementById('cameraFrame'),ownerFeedback=document.getElementById('ownerFeedback'),ownerRetry=document.getElementById('ownerRetry');
let ownerApprovedFiles=[],ownerUploading=false;
async function webmasterSession(){
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
 const client=createClient('https://wykvztfmfbboxiqvuvwr.supabase.co','sb_publishable_qOSBb7U6TGnPQ8ypyYRLGg_GtYrraoG',{auth:{storage:localStorage,storageKey:'container13-remember-auth-v2',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const {data,error}=await client.auth.getSession();
 if(error||!data.session)throw Error('Din inloggning har gått ut. Logga in igen.');
 return data.session.access_token;
}
async function uploadOwnerFiles(){
 if(ownerUploading||!ownerApprovedFiles.length)return;
  ownerFeedback.textContent='Kontrollerar webmasterinloggning…';ownerUploading=true;ownerRetry.hidden=true;document.getElementById('ownerCamera').disabled=true;document.getElementById('ownerFiles').disabled=true;
 let completed=0;
 try{
  const accessToken=await webmasterSession();
  for(const file of ownerApprovedFiles){
   ownerFeedback.textContent='Laddar upp bild '+(completed+1)+' av '+ownerApprovedFiles.length+'…';
   const prepared=await prepareRememberUpload(file);
   const form=new FormData();form.set('albumId',id);form.set('requestId',crypto.randomUUID());form.set('file',prepared.file);
   const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-photo-upload',{method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form,cache:'no-store'});
   const data=await response.json().catch(()=>({}));
   if(!response.ok||data.ok!==true)throw Error(data.error||'Servern svarade HTTP '+response.status);
   completed++;
  }
  ownerApprovedFiles=[];ownerFeedback.textContent=completed+' bilder sparade i albumet!';void rememberGallery.refresh();
 }catch(e){ownerApprovedFiles=ownerApprovedFiles.slice(completed);ownerFeedback.textContent=completed+' bilder sparade. '+ownerApprovedFiles.length+' återstår. '+(e instanceof Error?e.message:'Uppladdningen misslyckades.');ownerRetry.hidden=ownerApprovedFiles.length===0;}
 finally{ownerUploading=false;document.getElementById('ownerCamera').disabled=false;document.getElementById('ownerFiles').disabled=false;}
}
ownerRetry.onclick=uploadOwnerFiles;
document.getElementById('ownerCamera').onclick=()=>{document.getElementById('fileHost').hidden=true;cameraHost.hidden=false;document.getElementById('ownerCamera').hidden=true;cameraFrame.src='./camera-session-test.html?embedded=1&v=01f7cff';};
document.getElementById('closeCamera').onclick=()=>{cameraFrame.src='about:blank';cameraHost.hidden=true;document.getElementById('ownerCamera').hidden=false;};
document.getElementById('ownerFiles').onclick=()=>{document.getElementById('fileHost').hidden=false;document.getElementById('ownerFileInput').click();};
document.getElementById('ownerFileInput').onchange=e=>{if(ownerUploading)return;ownerApprovedFiles=Array.from(e.target.files||[]).filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));document.getElementById('fileFeedback').textContent=ownerApprovedFiles.length+' bilder valda.';if(ownerApprovedFiles.length)void uploadOwnerFiles();};
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==cameraFrame.contentWindow||e.data?.type!=='remember-camera-approved'||!Array.isArray(e.data.files)||ownerUploading)return;
 ownerApprovedFiles=e.data.files.filter(f=>f instanceof Blob).map((f,i)=>new File([f],'remember-foto-'+(i+1)+'.jpg',{type:'image/jpeg'}));
 document.getElementById('closeCamera').click();
 if(ownerApprovedFiles.length)void uploadOwnerFiles();
});
const input=document.getElementById('guestLink'),shareStatus=document.getElementById('shareStatus'),qr=document.getElementById('qr'),copy=document.getElementById('copyGuest');let shareUrl='';const storageKey='remember-guest-link-'+id;const remember=document.getElementById('rememberGuest'),forget=document.getElementById('forgetGuest');
document.getElementById('showGuest').onclick=async()=>{
 const raw=input.value.trim();let token=raw;
 try{if(/^https?:\/\//i.test(raw)){const parsed=new URL(raw);if(parsed.origin!==location.origin||!parsed.pathname.endsWith('/remember/album.html'))throw Error('Fel länk');token=new URLSearchParams(parsed.hash.slice(1)).get('token')||'';}}catch{token='';}
 if(!/^[A-Za-z0-9_-]{43}$/.test(token)){shareStatus.textContent='Ange en giltig befintlig gästlänk eller token.';qr.replaceChildren();copy.hidden=true;return;}
 shareUrl=new URL('./album.html',location.href).href+'#token='+token;
 shareStatus.textContent='Kontrollerar gästlänken…';copy.hidden=true;qr.replaceChildren();
 try{
 const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-guest-metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});
 const body=await response.json();
 if(!response.ok||body.found!==true||body.title!==title.textContent){shareStatus.textContent='Gästlänken är inte giltig för detta album.';return;}
 const {default:QRCode}=await import('https://esm.sh/qrcode@1.5.4');
 const svg=await QRCode.toString(shareUrl,{type:'svg',margin:2,width:280,errorCorrectionLevel:'M'});
 qr.innerHTML=svg;copy.hidden=false;remember.hidden=false;forget.hidden=!localStorage.getItem(storageKey);shareStatus.textContent='QR-koden öppnar albumet utan inloggning.';
 }catch{shareStatus.textContent='QR-koden kunde inte skapas just nu.';}
};
remember.onclick=()=>{if(!shareUrl)return;localStorage.setItem(storageKey,shareUrl);remember.hidden=true;forget.hidden=false;shareStatus.textContent='Gästlänken sparad på den här enheten. Använd bara på din egen dator.';};
forget.onclick=()=>{localStorage.removeItem(storageKey);forget.hidden=true;remember.hidden=!shareUrl;shareStatus.textContent='Den sparade gästlänken har glömts på denna enhet.';};
const saved=localStorage.getItem(storageKey);if(saved){input.value=saved;document.getElementById('showGuest').click();}
copy.onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);shareStatus.textContent='Gästlänken kopierad.';}catch{shareStatus.textContent='Kopiering misslyckades.';}};
</script></body></html>
