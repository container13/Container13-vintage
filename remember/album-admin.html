<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="referrer" content="no-referrer"><title>Remember – hantera album</title><style>body{font:16px/1.5 system-ui;background:#10231f;color:#f6f3e9;margin:0;padding:30px 18px}main{max-width:640px;margin:auto}a{color:#d9e7a4}input{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:10px 0;border-radius:10px}#qr{background:white;display:inline-block;margin:12px 0}#qr svg{display:block;max-width:75vw;height:auto}button{font:inherit;padding:12px;border-radius:10px;background:#d9e7a4;border:0}p{overflow-wrap:anywhere}</style></head><body><main><p><a href="./dashboard.html">← Dashboard</a></p><h1 id="title">Öppnar album…</h1><p id="status" role="status">Kontrollerar webmasteråtkomst.</p><p id="detail"></p><section id="sharing" hidden><h2>Delning och QR-kod</h2><p>En redan utfärdad gästlänk kan användas utan inloggning. Befintlig token kan av säkerhetsskäl inte läsas tillbaka från servern.</p><label for="guestLink">Klistra in befintlig gästlänk eller token</label><input id="guestLink" type="text" autocomplete="off" spellcheck="false" placeholder="Befintlig gästlänk eller token"><button id="showGuest" type="button">Visa QR-kod</button><p id="shareStatus" role="status"></p><div id="qr"></div><button id="copyGuest" type="button" hidden>Kopiera gästlänk</button></section></main><script type="module">
const title=document.getElementById('title'),status=document.getElementById('status'),detail=document.getElementById('detail');
const id=new URLSearchParams(location.search).get('id');
if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||'')){title.textContent='Ogiltigt album';status.textContent='Album-ID saknas.';}
else try{
 const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
 const url='https://wykvztfmfbboxiqvuvwr.supabase.co',key='sb_publishable_qOSBb7U6TGnPQ8ypyYRLGg_GtYrraoG';
 const client=createClient(url,key,{auth:{storage:localStorage,storageKey:'container13-remember-auth-v2',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const {data,error}=await client.auth.getSession();
 if(error||!data.session){location.replace('./login.html');}
 else {
  const response=await fetch(url+'/functions/v1/remember-webmaster',{method:'POST',headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({action:'list'}),cache:'no-store'});
  const body=await response.json();
  if(!response.ok||body.authorized!==true){title.textContent='Åtkomst nekad';status.textContent='Du saknar webmasterbehörighet.';}
  else {
   const album=Array.isArray(body.albums)?body.albums.find(a=>a.id===id):null;
   if(!album){title.textContent='Albumet hittades inte';status.textContent='Albumet finns inte i din behöriga albumlista.';}
   else {title.textContent=album.title||'Album';status.textContent='Albumet är öppnat i webmasterläge.';detail.textContent='Bildhantering ansluts härnäst. Befintlig gästlänk ändras inte.';document.getElementById('sharing').hidden=false;}
  }
 }
}catch{title.textContent='Kunde inte öppna albumet';status.textContent='Anslutningen misslyckades. Försök igen senare.'}
const input=document.getElementById('guestLink'),shareStatus=document.getElementById('shareStatus'),qr=document.getElementById('qr'),copy=document.getElementById('copyGuest');let shareUrl='';
document.getElementById('showGuest').onclick=async()=>{
 const raw=input.value.trim();let token=raw;
 try{if(/^https?:\/\//i.test(raw)){const parsed=new URL(raw);if(parsed.origin!==location.origin||!parsed.pathname.endsWith('/remember/album.html'))throw Error('Fel länk');token=new URLSearchParams(parsed.hash.slice(1)).get('token')||'';}}catch{token='';}
 if(!/^[A-Za-z0-9_-]{43}$/.test(token)){shareStatus.textContent='Ange en giltig befintlig gästlänk eller token.';qr.replaceChildren();copy.hidden=true;return;}
 shareUrl=new URL('./album.html',location.href).href+'#token='+token;
 shareStatus.textContent='Kontrollerar gästlänken…';copy.hidden=true;qr.replaceChildren();
 try{
 const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-guest-metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});
 const body=await response.json();
 if(!response.ok||body.found!==true||body.title!==title.textContent){shareStatus.textContent='Gästlänken är inte giltig för detta album.';return;}
 const {default:QRCode}=await import('https://esm.sh/qrcode@1.5.4');
 const svg=await QRCode.toString(shareUrl,{type:'svg',margin:2,width:280,errorCorrectionLevel:'M'});
 qr.innerHTML=svg;copy.hidden=false;shareStatus.textContent='QR-koden öppnar albumet utan inloggning.';
 }catch{shareStatus.textContent='QR-koden kunde inte skapas just nu.';}
};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);shareStatus.textContent='Gästlänken kopierad.';}catch{shareStatus.textContent='Kopiering misslyckades.';}};
</script></body></html>
