<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Remember – album</title><style>body{font:16px system-ui;background:#10231f;color:#f6f3e9;max-width:650px;margin:0 auto;padding:16px}h1{overflow-wrap:anywhere}p{line-height:1.5}#cameraHost{position:fixed;inset:0;z-index:9999;background:#10231f;display:flex;flex-direction:column}#cameraHost[hidden]{display:none!important}#closeCamera{flex:none;min-height:48px;text-align:left;background:#d9e7a4;color:#10231f;border:0;font-weight:700}#cameraFrame{flex:1;min-height:0;height:auto!important;width:100%;border:0}.mode-banner{position:sticky;top:0;z-index:20;background:#d9e7a4;color:#10231f;border:3px solid #7b9850;border-radius:12px;padding:13px 16px;margin-bottom:24px;font-size:18px;font-weight:900;box-shadow:0 5px 18px #0005}.mode-banner small{display:block;font-size:13px;font-weight:650}.remember-gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.remember-gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.remember-gallery-viewer{position:fixed;inset:0;z-index:10000;background:#000e;display:flex;align-items:center;justify-content:center;padding:14px}.remember-gallery-viewer[hidden]{display:none}.remember-gallery-viewer img{max-width:96vw;max-height:88dvh;object-fit:contain}.remember-gallery-viewer button{position:absolute;top:14px;right:14px;z-index:1;background:#d9e7a4;color:#10231f;border:0;border-radius:8px;padding:10px}@media(min-width:650px){.remember-gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}.guest-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 26px}.guest-actions button{background:#d9e7a4;color:#10231f;border:0;border-radius:14px;min-height:64px;padding:12px 8px;font:700 16px system-ui;cursor:pointer}.guest-actions button:nth-child(2){background:#1b3830;color:#f6f3e9;border:1px solid #638d7b}.guest-actions button:disabled{opacity:.55}#upload p:empty,#cameraResults:empty{display:none}#cameraUploadStatus,#uploadStatus,#cameraResults{font-size:14px;margin:8px 0}#send,#sendCamera{background:#d9e7a4;color:#10231f;border:0;border-radius:12px;padding:12px 16px;font-weight:700}#rememberGallery h2{margin-top:18px}.mode-banner{margin-bottom:16px}@media(max-width:370px){.guest-actions button{font-size:14px}}.guest-gallery-panel:not([hidden]){margin:24px 0 18px;padding:clamp(16px,4vw,26px);border:1px solid rgba(255,255,255,.35);border-radius:25px;background:rgba(44,33,24,.70);box-shadow:0 12px 35px rgba(0,0,0,.18)}.guest-gallery-panel h2{margin-top:0}.guest-gallery-panel .remember-gallery-grid{margin-bottom:0}</style><script src="../project-template/mobile-view-policy.js?v=2"></script><meta name="remember-mobile-policy" content="M-1.1"><link rel="stylesheet" href="./remember-design.css?v=0.1.66"><script defer src="./auto-update.js?v=0.1.66"></script><meta name="remember-release" content="remember-0.1.66"><script defer src="./remember-version.js?v=0.1.66"></script></head><body class="remember-shell" data-remember-view="memories"><main><div class="mode-banner" role="status">👥 GÄSTLÄGE<small>Delat album · Version G-1.2 · Design 0.1.23</small></div><h1 id="title">Öppnar album…</h1><p id="status" role="status" aria-live="polite">Kontrollerar gästlänken.</p><section id="upload" hidden><div class="guest-actions"><button id="openCamera" type="button">📷 Ta foto</button><button id="choosePhotos" type="button">🖼️ Lägg till bilder</button></div><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><div id="cameraHost" hidden><button id="closeCamera" type="button">← Tillbaka till albumet</button><iframe id="cameraFrame" title="Remember kamera" allow="camera"></iframe></div><div id="cameraResults" aria-live="polite"></div><button id="sendCamera" type="button" hidden>Försök ladda upp igen</button><p id="cameraUploadStatus" role="status" aria-live="polite"></p><button id="send" type="button" hidden>Försök ladda upp igen</button><p id="uploadStatus" role="status" aria-live="polite"></p></section><section id="rememberGallery" class="guest-gallery-panel" hidden></section></main><script type="module">
import { prepareRememberUpload } from "./upload-prepare.js";
import { mountRememberGallery } from "./photo-gallery.js?v=1";
const title=document.getElementById('title'),status=document.getElementById('status');
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
if(!/^[A-Za-z0-9_-]{43}$/.test(token)){title.textContent='Albumet kan inte öppnas';status.textContent='Gästlänken saknas eller är ogiltig.';}
else try{
 const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-guest-metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});
 const data=await response.json();
 if(!response.ok||data.found!==true){title.textContent='Albumet kan inte öppnas';status.textContent='Länken är ogiltig eller återkallad.';}
 else {title.textContent=data.title||'Remember-album';status.textContent=data.uploadsOpen?'':'Uppladdningen är stängd. Bilderna går fortfarande att se.';document.getElementById('upload').hidden=!data.uploadsOpen;}
}catch{title.textContent='Kunde inte öppna albumet';status.textContent='Försök igen om en stund.'}
const rememberGallery=/^[A-Za-z0-9_-]{43}$/.test(token)?mountRememberGallery({container:document.getElementById('rememberGallery'),auth:async()=>({token})}):null;
if(rememberGallery)document.getElementById('rememberGallery').hidden=false;
const cameraHost=document.getElementById('cameraHost'),cameraFrame=document.getElementById('cameraFrame'),cameraResults=document.getElementById('cameraResults');let selectedCameraFiles=[];document.getElementById('openCamera').onclick=()=>{cameraHost.hidden=false;document.getElementById('openCamera').hidden=true;cameraFrame.src='./camera-session-test.html?embedded=1&v=01f7cff';};document.getElementById('closeCamera').onclick=()=>{cameraFrame.src='about:blank';cameraHost.hidden=true;document.getElementById('openCamera').hidden=false;};const sendCamera=document.getElementById('sendCamera'),cameraUploadStatus=document.getElementById('cameraUploadStatus');let cameraUploading=false;
async function uploadApprovedCameraFiles(){
 if(cameraUploading||!selectedCameraFiles.length)return;
 cameraUploading=true;sendCamera.hidden=true;document.getElementById('openCamera').disabled=true;
 let completed=0;
 try{
  for(const file of selectedCameraFiles){
   cameraUploadStatus.textContent='Laddar upp bild '+(completed+1)+' av '+selectedCameraFiles.length+'…';
   const prepared=await prepareRememberUpload(file);
   const form=new FormData();form.set('token',token);form.set('requestId',crypto.randomUUID());form.set('file',prepared.file);
   const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-photo-upload',{method:'POST',body:form,cache:'no-store'});
   const data=await response.json().catch(()=>({}));
   if(!response.ok||data.ok!==true)throw Error(data.error||'Uppladdningen misslyckades (HTTP '+response.status+').');
   completed++;
  }
  selectedCameraFiles=[];cameraResults.textContent='';
  cameraUploadStatus.textContent='✓ '+completed+' '+(completed===1?'bild sparad':'bilder sparade')+'!';void rememberGallery?.refresh();
 }catch(e){
  selectedCameraFiles=selectedCameraFiles.slice(completed);
  cameraResults.textContent=selectedCameraFiles.length+' bilder väntar på nytt försök.';
  void rememberGallery?.refresh();cameraUploadStatus.textContent=completed+' bilder sparade. '+(e instanceof Error?e.message:'Uppladdningen misslyckades.')+' Tryck Försök ladda upp igen.';
  sendCamera.hidden=selectedCameraFiles.length===0;
 }finally{cameraUploading=false;document.getElementById('openCamera').disabled=false;}
}
sendCamera.onclick=uploadApprovedCameraFiles;
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==cameraFrame.contentWindow||e.data?.type!=='remember-camera-approved'||!Array.isArray(e.data.files)||cameraUploading)return;
 selectedCameraFiles=e.data.files.filter(f=>f instanceof Blob).map((f,i)=>new File([f],'remember-foto-'+(i+1)+'.jpg',{type:'image/jpeg'}));
 cameraResults.textContent='';
 document.getElementById('closeCamera').click();
 if(selectedCameraFiles.length)void uploadApprovedCameraFiles();
});
const send=document.getElementById('send'),photo=document.getElementById('photo'),uploadStatus=document.getElementById('uploadStatus'),choosePhotos=document.getElementById('choosePhotos');
let pendingFiles=[],fileUploading=false;
choosePhotos.onclick=()=>{if(!fileUploading)photo.click();};
photo.onchange=()=>{pendingFiles=Array.from(photo.files||[]).filter(f=>['image/jpeg','image/png','image/webp'].includes(f.type));if(pendingFiles.length)void uploadSelectedFiles();};
async function uploadSelectedFiles(){
 if(fileUploading||!pendingFiles.length)return;
 fileUploading=true;send.hidden=true;choosePhotos.disabled=true;let completed=0;
 try{
  for(const file of pendingFiles){
   uploadStatus.textContent='Laddar upp '+(completed+1)+' av '+pendingFiles.length+'…';
   const prepared=await prepareRememberUpload(file);
   const form=new FormData();form.set('token',token);form.set('requestId',crypto.randomUUID());form.set('file',prepared.file);
   const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-photo-upload',{method:'POST',body:form,cache:'no-store'});
   const data=await response.json().catch(()=>({}));
   if(!response.ok||data.ok!==true)throw Error(data.error||'Servern svarade HTTP '+response.status);
   completed++;
  }
  pendingFiles=[];photo.value='';uploadStatus.textContent='✓ '+completed+' '+(completed===1?'bild sparad':'bilder sparade')+'!';void rememberGallery?.refresh();
 }catch(e){pendingFiles=pendingFiles.slice(completed);uploadStatus.textContent=completed+' sparade. '+pendingFiles.length+' återstår. '+(e instanceof Error?e.message:'Uppladdningen misslyckades.');send.hidden=pendingFiles.length===0;void rememberGallery?.refresh();}
 finally{fileUploading=false;choosePhotos.disabled=false;}
}
send.onclick=uploadSelectedFiles;
</script></body></html>
