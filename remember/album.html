<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="referrer" content="no-referrer"><title>Remember – album</title><style>body{font:16px system-ui;background:#10231f;color:#f6f3e9;max-width:650px;margin:50px auto;padding:16px}h1{overflow-wrap:anywhere}p{line-height:1.5}</style></head><body><main><h1 id="title">Öppnar album…</h1><p id="status" role="status" aria-live="polite">Kontrollerar gästlänken.</p></main><script type="module">
const title=document.getElementById('title'),status=document.getElementById('status');
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
if(!/^[A-Za-z0-9_-]{43}$/.test(token)){title.textContent='Albumet kan inte öppnas';status.textContent='Gästlänken saknas eller är ogiltig.';}
else try{
 const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-guest-metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});
 const data=await response.json();
 if(!response.ok||data.found!==true){title.textContent='Albumet kan inte öppnas';status.textContent='Länken är ogiltig eller återkallad.';}
 else {title.textContent=data.title||'Remember-album';status.textContent=data.uploadsOpen?'Albumet är öppet för bilder. Bilduppladdning kommer snart.':'Albumets uppladdningstid är stängd. Bildvisning kommer snart.';}
}catch{title.textContent='Kunde inte öppna albumet';status.textContent='Försök igen om en stund.'}
</script></body></html>
