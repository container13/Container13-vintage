<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="referrer" content="no-referrer"><title>Remember – album</title><style>body{font:16px system-ui;background:#10231f;color:#f6f3e9;max-width:650px;margin:50px auto;padding:16px}h1{overflow-wrap:anywhere}p{line-height:1.5}#cameraHost{position:fixed;inset:0;z-index:9999;background:#10231f;display:flex;flex-direction:column}#cameraHost[hidden]{display:none!important}#closeCamera{flex:none;min-height:48px;text-align:left;background:#d9e7a4;color:#10231f;border:0;font-weight:700}#cameraFrame{flex:1;min-height:0;height:auto!important;width:100%;border:0}.mode-banner{position:sticky;top:0;z-index:20;background:#d9e7a4;color:#10231f;border:3px solid #7b9850;border-radius:12px;padding:13px 16px;margin-bottom:24px;font-size:18px;font-weight:900;box-shadow:0 5px 18px #0005}.mode-banner small{display:block;font-size:13px;font-weight:650}.remember-gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.remember-gallery-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}.remember-gallery-viewer{position:fixed;inset:0;z-index:10000;background:#000e;display:flex;align-items:center;justify-content:center;padding:14px}.remember-gallery-viewer[hidden]{display:none}.remember-gallery-viewer img{max-width:96vw;max-height:88dvh;object-fit:contain}.remember-gallery-viewer button{position:absolute;top:14px;right:14px;z-index:1;background:#d9e7a4;color:#10231f;border:0;border-radius:8px;padding:10px}@media(min-width:650px){.remember-gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><div class="mode-banner" role="status">👥 GÄSTLÄGE<small>Delat album – inga webmasterverktyg</small></div><h1 id="title">Öppnar album…</h1><p id="status" role="status" aria-live="polite">Kontrollerar gästlänken.</p><section id="upload" hidden><h2>Lägg till bilder</h2><p>Ta flera foton i följd och granska dem innan du väljer vad du vill använda.</p><button id="openCamera" type="button" style="display:inline-block;background:#d9e7a4;color:#10231f;font-weight:750;padding:15px 22px;border-radius:12px;text-decoration:none;margin:8px 8px 14px 0">📷 Ta foto</button><div id="cameraHost" hidden><button id="closeCamera" type="button">← Tillbaka till albumet</button><iframe id="cameraFrame" title="Remember kamera" allow="camera" style="width:100%;height:75dvh;border:0;background:#10231f"></iframe></div><div id="cameraResults" aria-live="polite"></div><button id="sendCamera" type="button" hidden>Försök ladda upp igen</button><p id="cameraUploadStatus" role="status" aria-live="polite"></p><p style="font-size:13px">Bilderna granskas lokalt. Serveruppladdning är ännu inte verifierad.</p><label for="photo">Eller välj en bild från enheten</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Välj bild"><button id="send" type="button">Ladda upp bild</button><p id="uploadStatus" role="status" aria-live="polite"></p></section><section id="rememberGallery" hidden></section></main><script type="module">
import { prepareRememberUpload } from "./upload-prepare.js";
import { mountRememberGallery } from "./photo-gallery.js?v=1";
const title=document.getElementById('title'),status=document.getElementById('status');
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
if(!/^[A-Za-z0-9_-]{43}$/.test(token)){title.textContent='Albumet kan inte öppnas';status.textContent='Gästlänken saknas eller är ogiltig.';}
else try{
 const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-guest-metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store'});
 const data=await response.json();
 if(!response.ok||data.found!==true){title.textContent='Albumet kan inte öppnas';status.textContent='Länken är ogiltig eller återkallad.';}
 else {title.textContent=data.title||'Remember-album';status.textContent=data.uploadsOpen?'Albumet är öppet för bilder.':'Albumets uppladdningstid är stängd. Bildvisning kommer snart.';document.getElementById('upload').hidden=!data.uploadsOpen;}
}catch{title.textContent='Kunde inte öppna albumet';status.textContent='Försök igen om en stund.'}
const rememberGallery=/^[A-Za-z0-9_-]{43}$/.test(token)?mountRememberGallery({container:document.getElementById('rememberGallery'),auth:async()=>({token})}):null;
if(rememberGallery)document.getElementById('rememberGallery').hidden=false;
const cameraHost=document.getElementById('cameraHost'),cameraFrame=document.getElementById('cameraFrame'),cameraResults=document.getElementById('cameraResults');let selectedCameraFiles=[];document.getElementById('openCamera').onclick=()=>{cameraHost.hidden=false;document.getElementById('openCamera').hidden=true;cameraFrame.src='./camera-session-test.html?embedded=1&v=01f7cff';};document.getElementById('closeCamera').onclick=()=>{cameraFrame.src='about:blank';cameraHost.hidden=true;document.getElementById('openCamera').hidden=false;};const sendCamera=document.getElementById('sendCamera'),cameraUploadStatus=document.getElementById('cameraUploadStatus');let cameraUploading=false;
async function uploadApprovedCameraFiles(){
 if(cameraUploading||!selectedCameraFiles.length)return;
 cameraUploading=true;sendCamera.hidden=true;document.getElementById('openCamera').disabled=true;
 let completed=0;
 try{
  for(const file of selectedCameraFiles){
   cameraUploadStatus.textContent='Laddar upp bild '+(completed+1)+' av '+selectedCameraFiles.length+'…';
   const prepared=await prepareRememberUpload(file);
   const form=new FormData();form.set('token',token);form.set('requestId',crypto.randomUUID());form.set('file',prepared.file);
   const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-photo-upload',{method:'POST',body:form,cache:'no-store'});
   const data=await response.json().catch(()=>({}));
   if(!response.ok||data.ok!==true)throw Error(data.error||'Uppladdningen misslyckades (HTTP '+response.status+').');
   completed++;
  }
  selectedCameraFiles=[];cameraResults.textContent='Bilderna är sparade i albumet.';
  cameraUploadStatus.textContent=completed+' av '+completed+' bilder sparade!';
 }catch(e){
  selectedCameraFiles=selectedCameraFiles.slice(completed);
  cameraResults.textContent=selectedCameraFiles.length+' bilder väntar på nytt försök.';
  void rememberGallery?.refresh();cameraUploadStatus.textContent=completed+' bilder sparade. '+(e instanceof Error?e.message:'Uppladdningen misslyckades.')+' Tryck Försök ladda upp igen.';
  sendCamera.hidden=selectedCameraFiles.length===0;
 }finally{cameraUploading=false;document.getElementById('openCamera').disabled=false;}
}
sendCamera.onclick=uploadApprovedCameraFiles;
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==cameraFrame.contentWindow||e.data?.type!=='remember-camera-approved'||!Array.isArray(e.data.files)||cameraUploading)return;
 selectedCameraFiles=e.data.files.filter(f=>f instanceof Blob).map((f,i)=>new File([f],'remember-foto-'+(i+1)+'.jpg',{type:'image/jpeg'}));
 cameraResults.textContent=selectedCameraFiles.length+' foton godkända.';
 document.getElementById('closeCamera').click();
 if(selectedCameraFiles.length)void uploadApprovedCameraFiles();
});
const send=document.getElementById('send'),photo=document.getElementById('photo'),uploadStatus=document.getElementById('uploadStatus');
send.onclick=async()=>{
 const file=photo.files?.[0];if(!file){uploadStatus.textContent='Välj en bild först.';return;}if(!window.confirm('Vill du publicera bilden i det här albumet?'))return;
 send.disabled=true;
 try{
  uploadStatus.textContent='Förbereder bilden…';
  const result=await prepareRememberUpload(file);
  uploadStatus.textContent='Laddar upp '+Math.round(result.uploadBytes/1024)+' KB…';
  const form=new FormData();form.set('token',token);form.set('requestId',crypto.randomUUID());form.set('file',result.file);
  const response=await fetch('https://wykvztfmfbboxiqvuvwr.supabase.co/functions/v1/remember-photo-upload',{method:'POST',body:form,cache:'no-store'});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data.ok!==true)throw Error(data.error||'Bilduppladdning är ännu inte aktiverad på servern (HTTP '+response.status+').');
  uploadStatus.textContent='Bilden är sparad!';photo.value='';void rememberGallery?.refresh();
 }catch(e){uploadStatus.textContent='Bilden sparades inte: '+(e instanceof Error?e.message:'Okänt fel');}
 finally{send.disabled=false;}
};
</script></body></html>
