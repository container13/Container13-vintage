<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Remember – delningstest</title><style>body{font:16px system-ui;background:#111827;color:#f8fafc;max-width:600px;margin:auto;padding:24px}button,select{font:inherit;padding:13px;border-radius:10px}button{background:#9de4c6;border:0;margin:10px 0}button:disabled{opacity:.5}select{width:100%}#status{white-space:pre-wrap}a{color:#9de4c6}code{overflow-wrap:anywhere}</style></head><body><h1>Remember – delningstest</h1><p>Välj ett av dina egna album. När du trycker på skapa sparas en riktig gästlänk i databasen. Länken kan ännu inte användas för gäståtkomst.</p><button id="load" disabled>Hämta mina album</button><div id="choose" hidden><label for="album">Album</label><select id="album"></select><button id="issue">Skapa testlänk</button></div><p id="status">Kontrollerar inloggning…</p><div id="result" hidden><p>Servern skapade en token. Spara den inte offentligt. Gästsidan är ännu inte färdig.</p><button id="copy">Kopiera token</button></div><p><a href="./login.html">Tillbaka till Remember</a></p><script type="module">
const $=id=>document.getElementById(id),url='https://wykvztfmfbboxiqvuvwr.supabase.co',key='sb_publishable_qOSBb7U6TGnPQ8ypyYRLGg_GtYrraoG';let client,token=null;
async function post(path,payload){const {data,error}=await client.auth.getSession();if(error||!data.session)throw Error('Logga in på Remember igen.');const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(url+'/functions/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:key,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify(payload),signal:c.signal});return {status:r.status,body:await r.json().catch(()=>({}))}}finally{clearTimeout(t)}}
try{const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');client=createClient(url,key,{auth:{storage:sessionStorage,storageKey:'container13-remember-test-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'implicit'}});const {data}=await client.auth.getSession();$('load').disabled=!data.session;$('status').textContent=data.session?'Inloggad. Hämta dina album.':'Ingen inloggning hittades i den här fliken.'}catch{$('status').textContent='Kunde inte kontrollera inloggningen.'}
$('load').onclick=async()=>{$('load').disabled=true;$('choose').hidden=true;$('status').textContent='Hämtar album…';try{const r=await post('remember-webmaster',{action:'list'});if(r.status!==200||!r.body.authorized)throw Error('Albumlistan nekades (HTTP '+r.status+').');const albums=(r.body.albums||[]).filter(a=>typeof a.id==='string');$('album').replaceChildren();for(const a of albums){const o=document.createElement('option');o.value=a.id;o.textContent=a.title||'Album';$('album').append(o)}$('choose').hidden=!albums.length;$('status').textContent=albums.length?albums.length+' album hittades.':'Inga album hittades.'}catch(e){$('status').textContent=e.message}finally{$('load').disabled=false}};
$('issue').onclick=async()=>{if(!$('album').value||!confirm('Skapa en riktig testlänk till det valda albumet?'))return;$('issue').disabled=true;$('result').hidden=true;token=null;$('status').textContent='Skapar testlänk…';try{const r=await post('remember-guest-link-webmaster',{action:'issue',albumId:$('album').value});if(r.status===200&&r.body.success&&typeof r.body.token==='string'){token=r.body.token;$('result').hidden=false;$('status').textContent='GODKÄNT: gästtoken skapad av servern. Gäståtkomst är ännu inte testad.'}else if(r.status===409){$('status').textContent='Albumet har redan en aktiv länk. Ingen ny token skapades. Vi ska inte rotera utan särskilt beslut.'}else{$('status').textContent='Testet misslyckades (HTTP '+r.status+'). Ingen token visas.'}}catch(e){$('status').textContent=e.message}finally{$('issue').disabled=false}};
$('copy').onclick=async()=>{if(!token)return;try{await navigator.clipboard.writeText(token);$('status').textContent='Token kopierad. Dela den inte förrän gäståtkomst är färdig.'}catch{$('status').textContent='Kopiering misslyckades.'}};
</script></body></html>
