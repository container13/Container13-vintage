<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Remember TEST – bildgranskning</title>
<style>body{margin:0;padding:20px 14px 70px;background:#10231f;color:#f6f3e9;font:16px/1.5 system-ui}main{max-width:680px;margin:auto}input,button{font:inherit;min-height:44px;border-radius:10px;padding:8px 12px;box-sizing:border-box}input{width:100%;margin:4px 0 12px}button{background:#d9e7a4;color:#10231f;border:0;font-weight:700}label{display:block}.warning{border:1px solid #e9bd6d;padding:12px;border-radius:12px}#review{margin-top:24px}[hidden]{display:none!important}</style>
<script src="../project-template/mobile-view-policy.js?v=2"></script><script defer src="./auto-update.js?v=0.1.75"></script>
</head><body><main><h1>Remember – bildgranskning TEST</h1><p class="warning">Separat TEST-miljö. Inga produktionsalbum visas eller ändras här. Använd bara ett TEST-konto och ett TEST-album-ID.</p>
<form id="login"><label>E-post för TEST-konto<input id="email" type="email" autocomplete="username" required></label><label>Lösenord för TEST-konto<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Logga in i TEST</button></form>
<form id="album" hidden><label>TEST-album-ID<input id="albumId" required pattern="[0-9a-fA-F-]{36}" placeholder="UUID"></label><button type="submit">Öppna bildgranskning</button> <button type="button" id="logout">Logga ut</button></form>
<p id="status" role="status" aria-live="polite"></p><div id="review"></div>
</main><script type="module">
import {mountOwnerReview} from "./owner-review-ui.js?v=0.1.76";
const project="https://kauxrvshxgpbvptdwhog.supabase.co",key="sb_publishable_iLKTdBYdh2w5ALhEyFtW8A_V8Gujyam";
const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");
const client=createClient(project,key,{auth:{storageKey:"container13-remember-TEST-review-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const el=id=>document.getElementById(id),status=el("status");
const {data:session}=await client.auth.getSession();el("login").hidden=!!session.session;el("album").hidden=!session.session;
el("login").onsubmit=async event=>{event.preventDefault();status.textContent="Loggar in…";const {error}=await client.auth.signInWithPassword({email:el("email").value.trim(),password:el("password").value});if(error){status.textContent="Inloggningen misslyckades: "+error.message;return}el("password").value="";el("login").hidden=true;el("album").hidden=false;status.textContent="Inloggad i TEST."};
el("logout").onclick=async()=>{await client.auth.signOut();el("review").replaceChildren();el("album").hidden=true;el("login").hidden=false;status.textContent="Utloggad."};
async function request(name,body){const {data}=await client.auth.getSession();if(!data.session)throw Error("Logga in i TEST igen.");const response=await fetch(project+"/functions/v1/"+name,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+data.session.access_token,"apikey":key},body:JSON.stringify(body),cache:"no-store"});const result=await response.json().catch(()=>({}));if(!response.ok||result.ok!==true)throw Error(result.error||"TEST-servern svarade HTTP "+response.status);return result}
el("album").onsubmit=async event=>{event.preventDefault();el("review").replaceChildren();const albumId=el("albumId").value.trim();if(!/^[0-9a-f-]{36}$/i.test(albumId)){status.textContent="Ogiltigt album-ID";return}status.textContent="Öppnar TEST-album…";const view=mountOwnerReview({host:el("review"),albumId,request});await view.refresh();status.textContent="TEST-granskningen öppnad."};
</script></body></html>
