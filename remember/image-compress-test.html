<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Remember – bildtest</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;background:#101923;color:#fff}button,input{font:inherit}input{width:100%;padding:12px;border:1px solid #8796a5;border-radius:8px}button{padding:12px;margin-top:12px;border:0;border-radius:8px;background:#c5f1dc;color:#10221b;font-weight:700}button:disabled{opacity:.5}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.pair img{width:100%;height:auto;display:block;border-radius:8px}.pair section{min-width:0}small{color:#cad3df}#status{margin-top:14px;white-space:pre-wrap}h1{font-size:1.5rem}p{line-height:1.45}
</style></head><body>
<h1>Remember – bildkomprimering</h1>
<p>Välj en bild för att jämföra originalet med den mobilanpassade versionen. Bilden behandlas enbart i webbläsaren och laddas inte upp.</p>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp">
<button id="run" disabled>Testa komprimering</button>
<p id="status" role="status" aria-live="polite">Välj en bild för att börja.</p>
<div class="pair"><section><strong>Original</strong><small id="originalSize"></small><img id="original" alt="Originalbild"></section><section><strong>Komprimerad</strong><small id="compressedSize"></small><img id="compressed" alt="Komprimerad bild"></section></div>
<script type="module">
import {prepareRememberImage} from "./image-compress.js";
const file=document.querySelector("#file"),run=document.querySelector("#run"),status=document.querySelector("#status");
const original=document.querySelector("#original"),compressed=document.querySelector("#compressed");
const fmt=n=>n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(2)+" MB";
let urls=[];
function clearUrls(){for(const url of urls)URL.revokeObjectURL(url);urls=[]}
file.addEventListener("change",()=>{run.disabled=!file.files.length;status.textContent=file.files.length?"Klar att testa.":"Välj en bild för att börja."});
run.addEventListener("click",async()=>{
 if(!file.files.length)return;
 run.disabled=true;status.textContent="Bearbetar bilden lokalt…";
 try{
  clearUrls();const source=file.files[0];const result=await prepareRememberImage(source);
  const a=URL.createObjectURL(source),b=URL.createObjectURL(result.blob);urls.push(a,b);
  original.src=a;compressed.src=b;
  document.querySelector("#originalSize").textContent=" – "+fmt(source.size);
  document.querySelector("#compressedSize").textContent=" – "+fmt(result.bytes)+" ("+result.width+" × "+result.height+")";
  const saved=(100*(1-result.bytes/source.size)).toFixed(0);
  status.textContent="Klart! "+(result.bytes<source.size?"Minskning "+saved+" %.":"Den behandlade bilden blev inte mindre.")+" Kontrollera skärpa, ansikten och detaljer i båda bilderna.";
 }catch(e){status.textContent="Fel: "+(e?.message||String(e))}
 finally{run.disabled=!file.files.length}
});
window.addEventListener("pagehide",clearUrls);
</script></body></html>
