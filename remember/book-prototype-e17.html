<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Remember Test E.17 – verklig vikningskurva</title><style>*{box-sizing:border-box}html{background:#10271e;color:#f6f0e8;font-family:system-ui,-apple-system,sans-serif}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 10px;background:radial-gradient(ellipse at 50% 30%,#36563e,#10271e 75%)}h1{font:400 clamp(38px,10vw,60px) Georgia,serif;margin:0}.note{max-width:450px;text-align:center;line-height:1.45;margin:0}.stage{width:min(92vw,620px);aspect-ratio:640/380;display:flex;align-items:center;justify-content:center}#flipbook{width:100%;height:100%}.page{background:#eee3ce;overflow:hidden;color:#234437;position:relative}.page-inner{position:absolute;inset:0;overflow:hidden;background:#eee3ce;border:1px solid #c6b89d;box-shadow:inset 0 0 15px #0002}.page img{position:absolute;left:5%;top:5%;width:90%;height:72%;object-fit:cover;border-radius:3px}.page span{position:absolute;left:4%;right:4%;top:79%;height:12%;display:grid;place-items:center;font-weight:600;font-size:clamp(11px,3vw,15px);text-align:center}.page small{position:absolute;right:5%;bottom:3%;font-size:10px;text-align:right;color:#777}.controls{display:flex;gap:12px}.controls button{background:#254b37;border:1px solid #8ca793;border-radius:12px;padding:12px 17px;color:white;font-size:16px}#status{font-size:13px;text-align:center;max-width:440px;color:#d1ded2;line-height:1.5}.turn-page{background-color:#eee3ce}</style></head><body><h1>Remember.</h1><p class="note">Test E.17 – styrd vikning punkt för punkt längs en diagonal kurva. Bedöm viklinjen och kopiera loggen.</p><div class="stage"><div id="flipbook"><div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&amp;q=80" alt="Fester & födelsedagar"><span>Fester & födelsedagar</span><small>1 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=800&amp;q=80" alt="Festljus"><span>Festljus</span><small>2 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1597956959732-9b8cb12f8960?w=800&amp;q=80" alt="Fiskeresor"><span>Fiskeresor</span><small>3 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?w=800&amp;q=80" alt="Vatten & stillhet"><span>Vatten & stillhet</span><small>4 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&amp;q=80" alt="Resor & äventyr"><span>Resor & äventyr</span><small>5 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&amp;q=80" alt="Skog & natur"><span>Skog & natur</span><small>6 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=800&amp;q=80" alt="Bröllop"><span>Bröllop</span><small>7 / 8</small></div></div>
<div class="page"><div class="page-inner"><img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=800&amp;q=80" alt="Blommor & detaljer"><span>Blommor & detaljer</span><small>8 / 8</small></div></div></div></div><div class="controls"><button id="prev" type="button">← Föregående</button><button id="next" type="button">Nästa →</button></div><div class="controls"><button id="copy-log" type="button">Kopiera testlogg</button><button id="restart" type="button">Börja om</button></div><textarea id="test-log" readonly aria-label="Testlogg" style="width:min(92vw,620px);height:125px;background:#10271e;color:#f6f0e8;border:1px solid #8ca793;border-radius:8px;padding:9px;font-size:12px"></textarea><div id="status" role="status">Test E.17 · startar …</div><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script><script>(function(){const status=document.getElementById('status');if(!window.jQuery||!jQuery.fn.turn){status.textContent='Kunde inte ladda sidvändningsmotorn. Testet kan inte köras.';return}const book=jQuery('#flipbook'),stage=document.querySelector('.stage');let lockedWidth=Math.round(stage.clientWidth);function size(){return {width:lockedWidth,height:Math.round(lockedWidth*380/640)}}book.turn(Object.assign(size(),{display:'double',gradients:true,acceleration:true,duration:2300,page:1}));const logEl=document.getElementById('test-log'),records=[],started=performance.now();let timer=null,holdUntil=0,finished=false,attempt=0,pending=null;
function view(){try{return book.turn('view')}catch(e){return []}}
function log(event,detail={}){const entry={t_ms:Math.round(performance.now()-started),event,page:book.turn('page'),view:view(),animating:!!book.turn('animating'),...detail};records.push(entry);logEl.value=JSON.stringify({test:'E.17',userAgent:navigator.userAgent,screen:[innerWidth,innerHeight],records},null,2);logEl.scrollTop=logEl.scrollHeight}
function report(){status.textContent='Test E.17 · sida '+book.turn('page')+' av '+book.turn('pages')+(finished?' · KLAR – kopiera testloggen':' · loggar automatiskt')}
function schedule(){clearTimeout(timer);if(finished||document.hidden||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;timer=setTimeout(function(){if(Date.now()<holdUntil){log('manual_wait');schedule();return}if(book.turn('animating')){log('busy_wait');schedule();return}const page=book.turn('page'),total=book.turn('pages');if(page>=total||attempt>=1){finished=true;log('finished',{total,attempts:attempt});report();return}nativeCornerTurn()},5400)}
function nativeCornerTurn(){
 const d=book.data(),v=view(),right=v[1]||v[0],p=d.pages&&d.pages[right];
 if(!p||!p.data('f')){log('missing_flip',{right});finished=true;report();return}
 const w=p.width(),h=p.height(),corner='br',duration=2600;
 const start=performance.now();attempt++;log('curve_start',{right,w,h,duration,corner});
 let lastLog=-1,frame=0;
 function tick(now){
  const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);
  const x=w-3-(w*1.78)*ease;
  const y=h-3-(h*.80)*ease+(h*.13)*Math.sin(Math.PI*t);
  const point={corner,x,y};
  try{
   p.flip('_showFoldedPage',point);
  }catch(e){
   log('fold_exception',{message:e.message,frame,point});
   finished=true;report();return
  }
  if(t===1||Math.floor(t*5)>lastLog){lastLog=Math.floor(t*5);log('curve_frame',{t:Math.round(t*100)/100,point,animating:book.turn('animating')})}
  frame++;
  if(t<1)requestAnimationFrame(tick);
  else{log('curve_complete',{frames:frame,point:p.data('f')&&p.data('f').point||null});finished=true;report()}
 }
 requestAnimationFrame(tick);
}
function manual(action){holdUntil=Date.now()+6000;clearTimeout(timer);log('manual',{action});book.turn(action);schedule()}
book.bind('turning',function(e,page){log('turning',{target:page})});book.bind('turned',function(e,page){log('turned',{target:page,active:Object.keys(book.data().pages||{}).filter(k=>{const p=book.data().pages[k];return p&&p.data&&p.data('f')&&p.data('f').point}).map(k=>({page:Number(k),point:book.data().pages[k].data('f').point})),pending:pending?{attempt:pending.attempt,corner:pending.corner,elapsed_ms:Math.round(performance.now()-pending.start_ms)}:null});report()});book.bind('start',function(e,pageObject,corner){log('fold_start',{corner:String(corner||'unknown'),pageObject:pageObject&&pageObject.attr?pageObject.attr('class'):null})});book.bind('end',function(){log('fold_end')});
document.getElementById('prev').onclick=()=>manual('previous');document.getElementById('next').onclick=()=>manual('next');
document.getElementById('copy-log').onclick=async()=>{const value=logEl.value;try{await navigator.clipboard.writeText(value);status.textContent='Test E.17 · loggen kopierad – klistra in i chatten'}catch(e){logEl.focus();logEl.select();try{document.execCommand('copy');status.textContent='Test E.17 · loggen markerad/kopierad'}catch(_){status.textContent='Test E.17 · markera och kopiera loggtexten'}}};
document.getElementById('restart').onclick=()=>{clearTimeout(timer);finished=false;pending=null;attempt=0;records.length=0;book.turn('page',1);log('restart');report();schedule()};
document.addEventListener('visibilitychange',()=>{log('visibility',{hidden:document.hidden});schedule()});window.addEventListener('resize',()=>{const w=Math.round(stage.clientWidth);if(w===lockedWidth)return;lockedWidth=w;const d=size();book.turn('size',d.width,d.height);log('resize',{width:w})});log('init',{total:book.turn('pages')});report();schedule()
})()</script></body></html>
