<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#10231f"><title>Remember. — by Container13</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10231f;color:#f6f3e9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{min-height:100svh;display:flex;flex-direction:column}main{width:min(100%,620px);margin:0 auto;padding:22px 18px 12px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.identity{text-align:center}.identity h1{font-family:Georgia,serif;font-size:clamp(42px,11vw,65px);font-weight:500;letter-spacing:-.04em;margin:0}.identity .by{font-size:13px;letter-spacing:.13em;color:#d9e7a4;margin-top:-5px}.tagline{color:#d3dfd6;text-align:center;margin:5px 0 8px;font-size:15px}.book{width:min(100%,380px);aspect-ratio:4/4.5;max-height:52svh;perspective:1200px;touch-action:pan-y;position:relative;filter:drop-shadow(0 16px 20px #0006)}.paper{position:absolute;inset:0;background:#e6dcc5;padding:9px 11px 13px;border-radius:5px 15px 15px 5px;box-shadow:inset 8px 0 12px #0002,2px 2px 0 #b9ad93;overflow:hidden;backface-visibility:hidden;transform-origin:left center;transition:transform .9s cubic-bezier(.22,.61,.36,1)}.paper.turn{transform:rotateY(-165deg)}.photo{height:calc(100% - 35px);border-radius:3px 9px 5px 3px;overflow:hidden;background:#48675d}.photo img{width:100%;height:100%;object-fit:cover;display:block}.caption{font:italic 17px Georgia,serif;color:#253d33;text-align:center;padding-top:8px}.pagecount{font-size:12px;color:#c1d0c4;text-align:center}.hint{font-size:12px;color:#a7bbad;text-align:center;margin:0}footer{position:sticky;bottom:0;z-index:5;background:#19352d;border-top:1px solid #476958;padding:14px max(18px,env(safe-area-inset-right)) calc(15px + env(safe-area-inset-bottom));text-align:center;box-shadow:0 -10px 30px #07171070}footer .cta{display:block;margin:auto;max-width:440px;background:#d9e7a4;color:#10231f;border-radius:12px;text-decoration:none;font-weight:800;padding:14px 18px;font-size:17px}footer p{font-size:12px;color:#d0decf;margin:8px 0 0}footer a.login{color:#d9e7a4;font-size:13px;display:inline-block;margin-top:8px}button.turner{border:1px solid #6c8a79;border-radius:99px;background:transparent;color:#e6eedf;font:inherit;padding:5px 13px;cursor:pointer}button.turner:focus-visible,a:focus-visible{outline:3px solid #d9e7a4;outline-offset:3px}.controls{display:flex;align-items:center;justify-content:center;gap:20px}.version{position:absolute;left:8px;top:7px;color:#a7bbad;font-size:10px}@media(max-height:680px){main{gap:6px;padding-top:8px}.identity h1{font-size:40px}.book{max-height:44svh}.tagline{margin:0}.hint{display:none}}@media(prefers-reduced-motion:reduce){.paper{transition:none}}
</style><script src="../project-template/mobile-view-policy.js?v=1"></script></head>
<body><main><div class="version">S-1.1 · utvecklingsversion</div><div class="identity"><h1>Remember.</h1><div class="by">by Container13</div></div><p class="tagline">Ögonblick värda att minnas.<br>Alla era bilder. Ett gemensamt album.</p>
<div class="book" id="book" aria-label="Fotobok med fyra exempel på gemensamma upplevelser"><div class="paper" id="paper"><div class="photo"><img id="photo" alt="Vänner på en fest" src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&amp;q=80" fetchpriority="high"></div><div class="caption" id="caption">Fester & födelsedagar</div></div></div>
<div class="controls"><button type="button" class="turner" id="previous" aria-label="Föregående sida">‹</button><span class="pagecount" id="pagecount">1 / 4</span><button type="button" class="turner" id="next" aria-label="Nästa sida">›</button></div><p class="hint">Boken bläddrar själv · Svep för att bläddra</p></main>
<footer><a class="cta" href="./register.html">Kom igång med e-post →</a><p>10 bilder gratis · Gäster behöver inget konto</p><a class="login" href="./login.html">Jag har redan ett konto</a></footer>
<script>
const pages=[
{caption:'Fester & födelsedagar',alt:'Fest och födelsedagsfirande',src:'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800&q=80'},
{caption:'Fiskeresor',alt:'Fisketur vid sjön',src:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800&q=80'},
{caption:'Resor & äventyr',alt:'Vandring och naturupplevelser',src:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80'},
{caption:'Bröllop',alt:'Bröllop och gemenskap',src:'https://images.unsplash.com/photo-1519741497674-611481863552?w=800&q=80'}
];
let index=0,turning=false,timer=null,downX=null;const paper=document.getElementById('paper'),photo=document.getElementById('photo'),caption=document.getElementById('caption'),count=document.getElementById('pagecount'),book=document.getElementById('book');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(delta){if(turning)return;turning=true;const next=(index+delta+pages.length)%pages.length;paper.classList.add('turn');setTimeout(()=>{index=next;photo.src=pages[index].src;photo.alt=pages[index].alt;caption.textContent=pages[index].caption;count.textContent=(index+1)+' / '+pages.length;paper.style.transition='none';paper.classList.remove('turn');void paper.offsetWidth;paper.style.transition='';turning=false;},reduced?0:900);}
function restart(){clearInterval(timer);if(!reduced)timer=setInterval(()=>{if(!document.hidden)show(1)},4000)}
document.getElementById('next').onclick=()=>{show(1);restart()};document.getElementById('previous').onclick=()=>{show(-1);restart()};book.addEventListener('touchstart',e=>{downX=e.touches[0]?.clientX},{passive:true});book.addEventListener('touchend',e=>{if(downX===null)return;const dx=e.changedTouches[0].clientX-downX;downX=null;if(Math.abs(dx)>35){show(dx<0?1:-1);restart()}},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)restart()});restart();
</script></body></html>
