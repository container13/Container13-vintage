<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d537b">
  <meta name="robots" content="noindex">
  <title>CompetenceTool för Android – under konstruktion</title>
  <style>
    :root { color-scheme: light; --blue:#0d537b; --blue-2:#197aaa; --ink:#163342; --muted:#607784; --line:#c7dce8; }
    * { box-sizing: border-box; }
    html { background: #eef3f6; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 22px 16px calc(22px + env(safe-area-inset-bottom));
      color: var(--ink); text-align: center;
      background: radial-gradient(circle at 50% 12%, rgba(25,122,170,.14), transparent 34%), #eef3f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main {
      width: min(100%, 520px); padding: 34px 22px 26px;
      border: 1px solid var(--line); border-radius: 26px;
      background: rgba(255,255,255,.98); box-shadow: 0 18px 44px rgba(13,83,123,.16);
    }
    .icon {
      display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 20px;
      border-radius: 24px; color: #fff; background: linear-gradient(145deg, var(--blue), var(--blue-2));
      box-shadow: 0 10px 22px rgba(13,83,123,.24); font-size: 42px;
    }
    .status {
      display: inline-block; padding: 7px 12px; border-radius: 999px;
      color: var(--blue); background: #e8f4fa; font-size: 13px; font-weight: 800;
      letter-spacing: .04em; text-transform: uppercase;
    }
    h1 { margin: 16px 0 10px; font-size: clamp(28px, 8vw, 38px); line-height: 1.08; }
    p { margin: 0 auto; max-width: 390px; color: var(--muted); font-size: 17px; line-height: 1.5; }
    .button {
      display: flex; align-items: center; justify-content: center; min-height: 54px;
      margin-top: 26px; padding: 12px 18px; border-radius: 15px;
      color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue-2));
      box-shadow: 0 8px 18px rgba(13,83,123,.2); text-decoration: none;
      font-size: 17px; font-weight: 800;
    }
    .signature { margin-top: 20px; color: #78909c; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🤖</div>
    <div class="status">Android</div>
    <h1>Under konstruktion</h1>
    <p>Android-versionen av CompetenceTool pausas medan vi bygger en stabil och genomtestad lösning.</p>
    <a class="button" href="./">← Tillbaka till iPhone-guiden</a>
    <div class="signature">CompetenceTool™ · @bulan73</div>
  </main>
</body>
</html>
