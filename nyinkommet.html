<html lang="sv">

<head>

<title>Nyinkommet | Container 13 Vintage</title>

    <link rel="stylesheet" href="css/style.css?v=6.6.8">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .page-header .logo-small {
            display: block;
            width: 680px;
            width: min(680px, 82vw);
            max-width: 82vw;
            margin: 0 auto -50px;
        }

        .page-header h1 {
            margin: 0 0 12px;
        }

        @media (max-width: 700px) {
            .page-header .logo-small {
                width: 320px;
                width: min(320px, 86vw);
                max-width: 86vw;
                margin-bottom: 24px;
            }
        }
    </style>

</head>

<body>

    <!-- Gemensam meny -->
    <div id="site-header"></div>


    <header class="page-header">

        <a href="index.html">

            <img src="bilder/logotyp/logo.png"
                class="logo-small"
                alt="Container 13 Vintage">

        </a>

        <h1>Nyinkommet</h1>

        <p>
            Senaste vintagefynden i butiken
        </p>

    </header>


    <main>

        <section
            id="nyGallery"
            class="gallery">

            <p class="gallery-status">
                Hämtar bilder...
            </p>

        </section>

    </main>


    <!-- Lightbox -->

    <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true">

        <button
            id="close"
            class="lightbox-close"
            type="button">

            &times;

        </button>

        <button
            class="prev"
            type="button">

            &#10094;

        </button>

        <img
            id="lightboxImage"
            alt="Nyinkommet">

        <button
            class="next"
            type="button">

            &#10095;

        </button>

    </div>


    <!-- Gemensam footer -->

    <div id="site-footer"></div>


    <!-- Firebase -->

    <script
        type="module"
        src="js/layout.js?v=6.6.8">
    </script>

    <script
        defer
        src="js/nyinkommet.js?v=4.0.0">
    </script>
<script type="module" src="js/analytics.js?v=6.3.0"></script>


  <script src="pwa.js" defer></script>

</html>
