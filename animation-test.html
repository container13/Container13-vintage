<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">
  <title>Förhandsgranska startanimation – Container13</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #f8f5ef;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }
    body { text-align: center; }
    .preview-page {
      min-height: 100vh;
      padding: 38px 22px 70px;
    }
    .preview-badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #222;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    .preview-logo {
      display: block;
      width: min(78vw, 430px);
      max-height: 300px;
      margin: 10px auto 18px;
      object-fit: contain;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 9vw, 58px);
      line-height: 1.05;
    }
    p {
      max-width: 620px;
      margin: 0 auto 20px;
      color: #666;
      font-size: clamp(17px, 4.6vw, 22px);
      line-height: 1.5;
    }
    .preview-summary {
      max-width: 560px;
      margin: 20px auto;
      padding: 14px 16px;
      border: 1px solid #ded6ca;
      border-radius: 10px;
      background: #fffdf8;
      font-weight: 700;
      line-height: 1.5;
    }
    .preview-times {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 560px;
      margin: 20px auto 0;
      padding: 16px;
      border: 1px solid #ded6ca;
      border-radius: 10px;
      background: #fffdf8;
      text-align: left;
    }
    .preview-times[hidden] { display: none; }
    .preview-time-field {
      display: grid;
      gap: 7px;
    }
    .preview-time-field label {
      font-size: 14px;
      font-weight: 800;
    }
    .preview-time-field input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #cfc6b9;
      border-radius: 8px;
      background: #fff;
      color: #222;
      font: inherit;
    }
    .preview-time-help {
      grid-column: 1 / -1;
      color: #766f66;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }
    .preview-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      min-height: 48px;
      padding: 13px 22px;
      border: 0;
      border-radius: 999px;
      background: #d4af37;
      color: #222;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    button.secondary {
      border: 1px solid #cfc6b9;
      background: #fff;
    }
    @media (max-width: 520px) {
      .preview-times { grid-template-columns: 1fr; }
      .preview-time-help { grid-column: auto; }
    }
    button:focus-visible {
      outline: 3px solid #222;
      outline-offset: 3px;
    }
    .animation-overlay {
      position: fixed;
      inset: 0;
      z-index: 50000;
      display: block;
      width: 100vw;
      height: 100dvh;
      pointer-events: none;
    }
    .animation-overlay[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="preview-page">
    <div class="preview-badge">FÖRHANDSVISNING · INTE AKTIVERAD</div>
    <img class="preview-logo" src="bilder/logotyp/logo.png" alt="Container 13 Vintage">
    <h1>Startanimation</h1>
    <p>Det här är en tillfällig förhandsvisning. Inga inställningar sparas från den här sidan.</p>
    <div id="preview-summary" class="preview-summary"></div>
    <div id="preview-times" class="preview-times">
      <div class="preview-time-field">
        <label id="preview-initial-label" for="preview-initial-seconds">Väntetid (sekunder)</label>
        <input id="preview-initial-seconds" type="number" min="0" max="5" step="0.1" inputmode="decimal">
      </div>
      <div class="preview-time-field">
        <label for="preview-reveal-seconds">Stjärnöppning (sekunder)</label>
        <input id="preview-reveal-seconds" type="number" min="0.2" max="5" step="0.1" inputmode="decimal">
      </div>
      <small class="preview-time-help">Ändra tiderna och välj Kör testet igen. Testvärdena sparas inte på hemsidan.</small>
    </div>
    <div class="preview-actions">
      <button id="run-preview-button" type="button">Kör testet igen</button>
      <button id="reset-preview-times-button" class="secondary" type="button">Återställ tider</button>
      <button id="close-preview-button" class="secondary" type="button">Stäng förhandsvisning</button>
    </div>
  </main>

  <canvas
    id="animation-overlay"
    class="animation-overlay"
    aria-hidden="true"
    hidden
  ></canvas>

  <script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    const validColor = (value, fallback) =>
      /^#[0-9a-f]{6}$/i.test(String(value || "")) ? value : fallback;
    const clampSeconds = (value, fallback, minimum) => {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return fallback;
      return Math.min(5, Math.max(minimum, parsed));
    };

    const requestedMode = params.get("mode");
    const settings = {
      mode: ["classic", "gold", "image", "none"].includes(requestedMode)
        ? requestedMode
        : "classic",
      backgroundColor: validColor(params.get("background"), "#000000"),
      starColor: validColor(params.get("star"), "#d4af37"),
      initialDuration: clampSeconds(params.get("initial"), 0.5, 0) * 1000,
      revealDuration: clampSeconds(params.get("reveal"), 1, 0.2) * 1000,
      imageUrl: params.get("image") || "",
      imageFit: params.get("fit") === "contain" ? "contain" : "cover"
    };

    const overlay = document.getElementById("animation-overlay");
    const context = overlay.getContext("2d");
    const summary = document.getElementById("preview-summary");
    const timesPanel = document.getElementById("preview-times");
    const initialLabel = document.getElementById("preview-initial-label");
    const initialInput = document.getElementById("preview-initial-seconds");
    const revealInput = document.getElementById("preview-reveal-seconds");
    const runButton = document.getElementById("run-preview-button");
    const resetButton = document.getElementById("reset-preview-times-button");
    const closeButton = document.getElementById("close-preview-button");
    let animationFrame = 0;
    let startTimer = 0;
    let fallbackTimer = 0;
    let runNumber = 0;
    const previewImage = new Image();
    let previewImageReady = false;
    const originalTimes = {
      initialDuration: settings.initialDuration,
      revealDuration: settings.revealDuration
    };

    const modeNames = {
      classic: "Klassisk stjärnöppning",
      gold: "Krympande guldstjärna + stjärnöppning",
      image: "Stjärnöppning med bakgrundsbild",
      none: "Ingen animation"
    };

    timesPanel.hidden = settings.mode === "none";
    resetButton.hidden = settings.mode === "none";
    initialLabel.textContent = settings.mode === "gold" || settings.mode === "image"
      ? "Guldstjärnans krymptid (sekunder)"
      : "Svart väntetid (sekunder)";
    initialInput.value = String(settings.initialDuration / 1000);
    revealInput.value = String(settings.revealDuration / 1000);

    function updateSummary() {
      summary.textContent = settings.mode === "none"
        ? modeNames.none
        : `${modeNames[settings.mode]} · ${settings.initialDuration / 1000} s + ${settings.revealDuration / 1000} s`;
    }

    function readPreviewTimes() {
      settings.initialDuration = clampSeconds(
        initialInput.value,
        settings.initialDuration / 1000,
        0
      ) * 1000;
      settings.revealDuration = clampSeconds(
        revealInput.value,
        settings.revealDuration / 1000,
        0.2
      ) * 1000;
      initialInput.value = String(settings.initialDuration / 1000);
      revealInput.value = String(settings.revealDuration / 1000);
      updateSummary();
    }

    updateSummary();

    function drawStar(width, height, radius) {
      const cx = width / 2;
      const cy = height / 2;
      context.beginPath();
      for (let index = 0; index < 10; index += 1) {
        const angle = -Math.PI / 2 + index * Math.PI / 5;
        const pointRadius = index % 2 === 0 ? radius : radius * 0.46;
        const x = cx + Math.cos(angle) * pointRadius;
        const y = cy + Math.sin(angle) * pointRadius;
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.closePath();
    }

    function paintReveal(width, height, radius) {
      context.globalCompositeOperation = "source-over";
      context.clearRect(0, 0, width, height);
      context.fillStyle = settings.backgroundColor;
      context.fillRect(0, 0, width, height);
      if (settings.mode === "image" && previewImageReady) {
        const scale = settings.imageFit === "contain"
          ? Math.min(width / previewImage.naturalWidth, height / previewImage.naturalHeight)
          : Math.max(width / previewImage.naturalWidth, height / previewImage.naturalHeight);
        const drawWidth = previewImage.naturalWidth * scale;
        const drawHeight = previewImage.naturalHeight * scale;
        context.drawImage(
          previewImage,
          (width - drawWidth) / 2,
          (height - drawHeight) / 2,
          drawWidth,
          drawHeight
        );
      }
      context.globalCompositeOperation = "destination-out";
      drawStar(width, height, radius);
      context.fill();
      context.globalCompositeOperation = "source-over";
    }

    function paintGold(width, height, radius) {
      context.globalCompositeOperation = "source-over";
      context.clearRect(0, 0, width, height);
      context.fillStyle = settings.backgroundColor;
      context.fillRect(0, 0, width, height);
      if (settings.mode === "image" && previewImageReady) {
        const scale = settings.imageFit === "contain"
          ? Math.min(width / previewImage.naturalWidth, height / previewImage.naturalHeight)
          : Math.max(width / previewImage.naturalWidth, height / previewImage.naturalHeight);
        const drawWidth = previewImage.naturalWidth * scale;
        const drawHeight = previewImage.naturalHeight * scale;
        context.drawImage(
          previewImage,
          (width - drawWidth) / 2,
          (height - drawHeight) / 2,
          drawWidth,
          drawHeight
        );
      }
      context.fillStyle = settings.starColor;
      drawStar(width, height, radius);
      context.fill();
    }

    function stopAnimation() {
      cancelAnimationFrame(animationFrame);
      clearTimeout(startTimer);
      clearTimeout(fallbackTimer);
      animationFrame = 0;
      startTimer = 0;
      fallbackTimer = 0;
    }

    function finishPreview(currentRun) {
      if (currentRun !== runNumber) return;
      overlay.hidden = true;
    }

    function runPreview() {
      readPreviewTimes();
      runNumber += 1;
      const currentRun = runNumber;
      stopAnimation();

      if (settings.mode === "none") {
        overlay.hidden = true;
        return;
      }

      const width = window.innerWidth;
      const height = window.innerHeight;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      const diagonal = Math.hypot(width / 2, height / 2);
      const revealRadius = diagonal * 2.25;
      const goldRadius = (diagonal / 0.46) * 1.2;

      overlay.width = Math.round(width * pixelRatio);
      overlay.height = Math.round(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      overlay.hidden = false;

      const reveal = () => {
        let startedAt = null;

        const animateReveal = (now) => {
          if (currentRun !== runNumber) return;
          if (startedAt === null) startedAt = now;
          const progress = Math.min(
            1,
            (now - startedAt) / settings.revealDuration
          );
          const eased = Math.pow(progress, 1.35);
          const radius = 6 + (revealRadius - 6) * eased;

          paintReveal(width, height, radius);

          if (progress < 1) {
            animationFrame = requestAnimationFrame(animateReveal);
          } else {
            finishPreview(currentRun);
          }
        };

        animationFrame = requestAnimationFrame(animateReveal);
      };

      if (settings.mode === "gold" || settings.mode === "image") {
        let startedAt = null;
        paintGold(width, height, goldRadius);

        const shrinkGold = (now) => {
          if (currentRun !== runNumber) return;
          if (startedAt === null) startedAt = now;
          const duration = Math.max(1, settings.initialDuration);
          const progress = Math.min(1, (now - startedAt) / duration);
          const smooth = progress * progress * (3 - 2 * progress);
          const radius = goldRadius * (1 - smooth);
          paintGold(width, height, radius);

          if (progress < 1 && settings.initialDuration > 0) {
            animationFrame = requestAnimationFrame(shrinkGold);
          } else {
            paintReveal(width, height, 0);
            reveal();
          }
        };

        animationFrame = requestAnimationFrame(shrinkGold);
      } else {
        paintReveal(width, height, 0);
        startTimer = window.setTimeout(reveal, settings.initialDuration);
      }

      fallbackTimer = window.setTimeout(
        () => finishPreview(currentRun),
        settings.initialDuration + settings.revealDuration + 1500
      );
    }

    runButton.addEventListener("click", runPreview);
    [initialInput, revealInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") runPreview();
      });
    });
    resetButton.addEventListener("click", () => {
      settings.initialDuration = originalTimes.initialDuration;
      settings.revealDuration = originalTimes.revealDuration;
      initialInput.value = String(settings.initialDuration / 1000);
      revealInput.value = String(settings.revealDuration / 1000);
      updateSummary();
      runPreview();
    });
    closeButton.addEventListener("click", () => {
      window.close();
      if (!window.closed) window.history.back();
    });

    if (settings.mode === "image" && settings.imageUrl) {
      previewImage.onload = () => {
        previewImageReady = true;
        runPreview();
      };
      previewImage.onerror = () => {
        summary.textContent += " · Bilden kunde inte laddas, reservfärgen visas";
        runPreview();
      };
      previewImage.src = settings.imageUrl;
    } else {
      runPreview();
    }
  })();
  </script>
</body>
</html>
