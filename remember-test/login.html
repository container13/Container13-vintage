<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Remember TEST – Logga in</title>
<style>body{font:16px system-ui;background:#1d2524;color:#fff;max-width:480px;margin:32px auto;padding:16px}h1{font-size:34px}.test{background:#ffc66b;color:#231b0e;padding:12px;border-radius:9px;font-weight:900}.panel{background:#29332f;border:1px solid #708477;border-radius:16px;padding:20px;margin-top:20px}label{display:block;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border-radius:8px;border:1px solid #999;background:#fff;color:#111}button{padding:12px;margin:12px 8px 0 0;background:#ffc66b;border:0;border-radius:9px;font-weight:bold}a{color:#ffc66b}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><div class="test">TESTMILJÖ – INTE ORIGINAL</div><h1>Remember Test</h1><p>Separat testinloggning. Endast testkonton, aldrig originalets lösenord.</p><div class="panel"><p>Projekt: <code>kauxrvshxgpbvptdwhog</code></p>
<form id="form"><label for="email">E-post för testkonto</label><input id="email" type="email" required autocomplete="username"><label for="password">Testkontots lösenord</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">Logga in i TEST</button></form>
<button id="check">Kontrollera session</button><button id="logout">Logga ut ur TEST</button><button id="copy">Kopiera rapport</button><p id="status" role="status">Testklienten laddas…</p></div><p><a href="./">Till TEST-start</a></p>
<script type="module">
const ref='kauxrvshxgpbvptdwhog',key='sb_publishable_iLKTdBYdh2w5ALhEyFtW8A_V8Gujyam',storageKey='container13-remember-test-auth-v1',status=document.getElementById('status');
let client;const say=s=>status.textContent=s;
try{const sdk=await import('https://esm.sh/@supabase/supabase-js@2');client=sdk.createClient('https://'+ref+'.supabase.co',key,{auth:{storage:localStorage,storageKey,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});say('TEST-klient klar. Ingen inloggning gjord.')}catch(e){say('Kunde inte initiera TEST-klienten.')}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('password').value='';say('Kontrollerar TEST-konto…');try{const {data,error}=await client.auth.signInWithPassword({email,password});say(error?'TEST-inloggning nekad: '+error.message:data.session?'Inloggad i TEST.':'Ingen TEST-session.')}catch(e){say('Nätverksfel vid TEST-inloggning.')}});
document.getElementById('check').onclick=async()=>{if(!client)return;const {data,error}=await client.auth.getSession();say(error?'TEST-session kunde inte läsas.':data.session?'TEST-session finns.':'Ingen TEST-session.')};
document.getElementById('logout').onclick=async()=>{if(!client)return;const {error}=await client.auth.signOut({scope:'local'});say(error?'Utloggning misslyckades.':'Utloggad ur TEST.')};
document.getElementById('copy').onclick=async()=>{const report=['Remember TEST','Projekt: '+ref,'Sida: '+location.href,'Tid: '+new Date().toLocaleString('sv-SE'),'Resultat: '+status.textContent].join('\n');try{await navigator.clipboard.writeText(report);say(status.textContent+'\nRapport kopierad.')}catch(e){say(status.textContent+'\nKopiering blockerad.')}};
</script></body></html>
