<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Remember TEST – Registrera</title>
<style>body{font:16px system-ui;background:#1d2524;color:#fff;max-width:480px;margin:32px auto;padding:16px}h1{font-size:32px}.test{background:#ffc66b;color:#231b0e;padding:12px;border-radius:9px;font-weight:900}.panel{background:#29332f;border:1px solid #708477;border-radius:16px;padding:20px;margin-top:20px}label{display:block;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border-radius:8px;border:1px solid #999;background:#fff;color:#111}button{padding:12px;margin:12px 8px 0 0;background:#ffc66b;border:0;border-radius:9px;font-weight:bold}button:disabled{opacity:.6}a{color:#ffc66b}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><div class="test">TESTMILJÖ – INTE ORIGINAL</div><h1>Skapa testkonto</h1><p>Endast Remember Test. Använd ett nytt testlösenord, aldrig lösenordet till originalet.</p>
<div class="panel"><form id="form"><label for="email">E-postadress</label><input id="email" type="email" autocomplete="email" value="mangaj73@gmail.com" required><label for="password">Nytt testlösenord (minst 12 tecken)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><button id="submit" type="submit">Registrera i TEST</button></form><button id="copy" type="button">Kopiera rapport</button><p id="status" role="status">Laddar testklient…</p></div><p><a href="./login.html">Till TEST-inloggning</a></p>
<script type="module">
const ref='kauxrvshxgpbvptdwhog',key='sb_publishable_iLKTdBYdh2w5ALhEyFtW8A_V8Gujyam',status=document.getElementById('status'),button=document.getElementById('submit');let client;const say=s=>status.textContent=s;
try{const sdk=await import('https://esm.sh/@supabase/supabase-js@2');client=sdk.createClient('https://'+ref+'.supabase.co',key,{auth:{storageKey:'container13-remember-test-register-v1',persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});say('Redo att skapa ett separat TEST-konto.')}catch(e){say('Kunde inte ladda testklienten.')}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!client)return;button.disabled=true;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('password').value='';say('Begär registrering i TEST…');try{const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:'https://container13.se/remember-test/activate.html'}});say(error?'Registreringen kunde inte slutföras: '+error.message:'Registreringsbegäran mottagen i TEST. Kontrollera din e-post och klicka på aktiveringslänken. Ingen bekräftad inloggning ännu.')}catch(e){say('Nätverksfel vid registrering.')}finally{button.disabled=false}};
document.getElementById('copy').onclick=async()=>{const t=['Remember TEST – registrering','Projekt: '+ref,'Tid: '+new Date().toLocaleString('sv-SE'),'Resultat: '+status.textContent].join('\n');try{await navigator.clipboard.writeText(t);say(status.textContent+'\nRapport kopierad.')}catch(e){say(status.textContent+'\nKopiering blockerad.')}};
</script></body></html>
