<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Linas Opti · Clean Core</title><link rel="stylesheet" href="style.css?v=0.1.4"></head>
<body class="locked">
<div id="loginGate" class="gate"><form id="loginForm" class="gate-card"><img src="lina-circle.png" alt="" class="logo"><h1>Linas Opti</h1><div class="version">Clean Core V0.1.4</div><p>Ange lösenkod för att fortsätta</p><input id="loginCode" name="lina_one_time_code_0470" type="password" inputmode="text" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" value="" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="Lösenkod"><button id="loginEnter" class="primary" type="submit">Öppna Linas Opti</button><div id="loginMsg" class="login-msg" aria-live="polite"></div></form></div>
<div id="app" hidden><header class="header"><div><b>Linas Opti</b><small>Clean Core V0.1.4</small></div><div class="header-status"><button id="refreshApp" class="refresh" type="button" aria-label="Uppdatera Lina" title="Uppdatera Lina"><span aria-hidden="true">↻</span><small>Uppdatera</small></button><span>Robotmognad 48/100</span><strong>Handel AV</strong></div></header><main id="view"></main></div>
<script>
(function(){
  const gate=document.getElementById('loginGate'),form=document.getElementById('loginForm'),input=document.getElementById('loginCode'),msg=document.getElementById('loginMsg');
  let opened=false;
  function open(){
    if(opened)return;opened=true;
    sessionStorage.setItem('linasopti_unlocked','1');
    gate.style.display='none';gate.setAttribute('aria-hidden','true');document.body.classList.remove('locked');
    document.dispatchEvent(new CustomEvent('lina:unlocked'));
  }
  function unlock(){
    if((input.value||'').trim().toLowerCase()==='adam'){
      msg.textContent='✓ Kod godkänd';msg.className='login-msg';setTimeout(open,120);
    }else{msg.textContent='Fel lösenkod';msg.className='login-msg bad';input.focus();input.select();}
  }
  form.addEventListener('submit',function(e){e.preventDefault();unlock();});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.keyCode===13){
      e.preventDefault();
      unlock();
    }
  });
  if(sessionStorage.getItem('linasopti_unlocked')==='1')open();else setTimeout(()=>input.focus(),50);
})();
</script>
<script defer src="state.js?v=0.1.4"></script>
<script defer src="api.js?v=0.1.4"></script>
<script defer src="router.js?v=0.1.4"></script>
<script defer src="g2.js?v=0.1.4"></script>
<script defer src="app.js?v=0.1.4"></script>
</body></html>
