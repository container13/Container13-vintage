<script>
(function(){
  const gate=document.getElementById('loginGate'),form=document.getElementById('loginForm'),input=document.getElementById('loginCode'),msg=document.getElementById('loginMsg');
  const deployStatus=document.getElementById('loginDeployStatus');
  let deployPoll=null;
  const GH_API='https://api.github.com/repos/container13/Container13-vintage';
  const statusWord=s=>s==='queued'?'Köad':s==='in_progress'?'Pågår':s==='completed'?'Klar':s||'—';
  async function ghJson(url){
    const res=await fetch(url,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
    if(!res.ok)throw Error('GitHub API '+res.status);
    return res.json();
  }
  function activeStep(job){
    const steps=job?.steps||[];
    return steps.find(s=>s.status==='in_progress')?.name||steps.find(s=>s.status==='queued')?.name||'';
  }
  async function checkDeployStatus(){
    if(!deployStatus)return;
    if(deployPoll){clearTimeout(deployPoll);deployPoll=null}
    deployStatus.textContent='GitHub Actions · kontrollerar senaste commit…';deployStatus.className='login-msg';
    try{
      const branch='ccc-demo-public-test';
      const [commit,runs]=await Promise.all([
        ghJson(GH_API+'/commits/'+encodeURIComponent(branch)),
        ghJson(GH_API+'/actions/runs?branch='+encodeURIComponent(branch)+'&per_page=10')
      ]);
      const sha=commit.sha,short=sha.slice(0,8);
      const run=(runs.workflow_runs||[]).find(x=>x.name==='pages build and deployment'&&x.head_sha===sha);
      if(!run){
        deployStatus.textContent='Commit '+short+' · väntar på Pages Actions-run…';
        deployPoll=setTimeout(checkDeployStatus,5000);return;
      }
      const jobs=await ghJson(GH_API+'/actions/runs/'+run.id+'/jobs?per_page=20');
      const list=jobs.jobs||[],build=list.find(j=>j.name==='build'),deploy=list.find(j=>j.name==='deploy');
      let detail='';
      if(run.status==='queued')detail='Köad';
      else if(run.status==='in_progress'){
        const active=list.find(j=>j.status==='in_progress')||list.find(j=>j.status==='queued');
        detail=(active?.name||'Actions')+(activeStep(active)?' · '+activeStep(active):'')+'…';
      }else if(run.conclusion==='success')detail='Completed ✓';
      else detail='Completed · '+String(run.conclusion||'okänd').toUpperCase()+' ✕';
      deployStatus.textContent='Commit '+short+' · '+detail;
      deployStatus.className='login-msg'+(run.status==='completed'&&run.conclusion!=='success'?' bad':'');
      deployStatus.title='Pages build and deployment #'+run.run_number+' · build '+statusWord(build?.status)+' · deploy '+statusWord(deploy?.status);
      deployStatus.style.cursor='pointer';
      deployStatus.onclick=()=>window.open(run.html_url,'_blank','noopener');
      if(run.status!=='completed')deployPoll=setTimeout(checkDeployStatus,5000);
    }catch(e){
      deployStatus.textContent='GitHub Actions-status kunde inte läsas';
      deployStatus.className='login-msg bad';deployStatus.title=String(e?.message||e);
      deployPoll=setTimeout(checkDeployStatus,15000);
    }
  }
  checkDeployStatus();
  window.addEventListener('pageshow',checkDeployStatus);
  const params=new URLSearchParams(window.location.search);
  const forceLogin=params.get('force_login')==='1';
  const navEntry=performance.getEntriesByType?.('navigation')?.[0];
  const browserReload=navEntry?.type==='reload';
  // V0.2.20: både Linas egen Uppdatera och webbläsarens vanliga Uppdatera ska ge en ren login-start.
  if(forceLogin || browserReload){
    sessionStorage.removeItem('linasopti_unlocked');
    sessionStorage.removeItem('linasopti_login_code');
  }
  if(forceLogin){
    history.replaceState(null,'',window.location.pathname);
  }

  // Återanvänd bevisad V0.46.3-lösning från legacy-Lina: loginfältet ska alltid öppna tomt.
  function clearLoginField(){
    input.value='';
    input.defaultValue='';
    input.removeAttribute('value');
  }
  clearLoginField();
  setTimeout(clearLoginField,50);
  setTimeout(clearLoginField,250);
  setTimeout(clearLoginField,800);
  window.addEventListener('pageshow',()=>{clearLoginField();setTimeout(clearLoginField,100);});
  document.addEventListener('focusin',e=>{
    if(e.target===input && document.body.classList.contains('locked')){
      if(!input.dataset.loginTouched){input.value='';input.dataset.loginTouched='1';}
    }
  });

  // V0.4.15 measured iOS focus-scroll fix: login is top-anchored at scrollY=0.
  // Real-device trace proved Safari had already moved the document to scrollY=92 before input-sync.
  // Neutralize only that document scroll; do not alter card geometry, viewport height or positioning mode.
  function restoreLoginTop(){
    if(document.body.classList.contains('locked') && window.scrollY!==0) window.scrollTo(0,0);
  }
  input.addEventListener('focus',()=>{
    restoreLoginTop();
    requestAnimationFrame(restoreLoginTop);
    setTimeout(restoreLoginTop,0);
    setTimeout(restoreLoginTop,100);
  });
  input.addEventListener('input',()=>{
    restoreLoginTop();
    requestAnimationFrame(restoreLoginTop);
    setTimeout(restoreLoginTop,100);
  });

  // V0.4.15 diagnostics only: capture real iOS geometry around the first typed character without changing layout.
  let firstInputTraceDone=false;
  function captureLoginGeometry(stage){
    const card=form.getBoundingClientRect(),field=input.getBoundingClientRect();
    return {stage,at:Math.round(performance.now()),scrollY:window.scrollY,innerH:window.innerHeight,cardTop:Math.round(card.top),cardBottom:Math.round(card.bottom),cardHeight:Math.round(card.height),inputTop:Math.round(field.top),inputBottom:Math.round(field.bottom),inputHeight:Math.round(field.height),active:document.activeElement?.id||document.activeElement?.tagName||''};
  }
  input.addEventListener('input',()=>{
    if(firstInputTraceDone)return;
    firstInputTraceDone=true;
    const trace=[captureLoginGeometry('input-sync')];
    requestAnimationFrame(()=>trace.push(captureLoginGeometry('input-raf')));
    setTimeout(()=>{
      trace.push(captureLoginGeometry('input-100ms'));
      const report={schema:'LINA-LOGIN-FIRST-INPUT-TRACE-1',version:'V0.4.15',trace,capturedAt:new Date().toISOString()}; sessionStorage.setItem('lina_login_first_input_trace_v0415',JSON.stringify(report)); sessionStorage.setItem('lina_login_trace_pending_v0415',JSON.stringify(report));
    },100);
  });

  let opened=false;
  function open(){
    if(opened)return;opened=true;
    sessionStorage.setItem('linasopti_unlocked','1');
    // V0.2.20 permanent rule: every new start/login begins at index/Dashboard.
    // Old route hashes such as #g2 must never decide the initial view.
    history.replaceState(null,'',window.location.pathname);
    gate.style.display='none';gate.setAttribute('aria-hidden','true');document.body.classList.remove('locked');
    document.dispatchEvent(new CustomEvent('lina:unlocked'));
  }
  async function unlock(){
    const code=(input.value||'').trim();
    if(!code)return;
    const authStarted=performance.now();
    msg.textContent='Kontrollerar…';msg.className='login-msg';
    try{
      const r=await fetch('https://linas-opti-api.mangaj73.workers.dev/auth-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(j.error||'Fel lösenkod');
      sessionStorage.setItem('lina_auth_duration_ms',String(Math.round(performance.now()-authStarted)));
      sessionStorage.setItem('linasopti_login_code',code);
      msg.textContent='✓ Kod godkänd';msg.className='login-msg';setTimeout(open,120);
    }catch(e){msg.textContent=e?.message==='Fel lösenkod'?'Fel lösenkod':'Inloggning kunde inte verifieras';msg.className='login-msg bad';input.focus();input.select();}
  }
  const refreshLina=document.getElementById('loginRefreshLina');
  refreshLina?.addEventListener('click',async function(){
    msg.textContent='Uppdaterar Lina…';msg.className='login-msg';
    refreshLina.disabled=true;
    try{
      const t=Date.now();
      const r=await fetch('version.js?manual_refresh='+t,{cache:'no-store'});
      const txt=await r.text();
      const m=txt.match(/RELEASE='(V[^']+)'/);
      const live=m&&m[1];
      location.replace(location.pathname+'?release='+encodeURIComponent(live||'latest')+'&t='+t);
    }catch(e){
      location.replace(location.pathname+'?refresh=1&t='+Date.now());
    }
  });
  form.addEventListener('submit',function(e){e.preventDefault();unlock();});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.keyCode===13){
      e.preventDefault();
      unlock();
    }
  });
  if(sessionStorage.getItem('linasopti_unlocked')==='1')open();else setTimeout(()=>input.focus(),50);
})();
</script>
