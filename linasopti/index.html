<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Linas Opti · Clean Core</title><link rel="stylesheet" href="style.css?v=0.2.34"></head>
<body class="locked">
<div id="loginGate" class="gate"><form id="loginForm" class="gate-card"><img src="lina-circle.png" alt="" class="logo"><h1>Linas Opti</h1><div class="version">Clean Core V0.2.34</div><p>Ange lösenkod för att fortsätta</p><input id="loginCode" name="lina_one_time_code_0470" type="password" inputmode="text" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" value="" data-lpignore="true" data-1p-ignore="true" data-bwignore="true" placeholder="Lösenkod"><button id="loginEnter" class="primary" type="submit">Öppna Linas Opti</button><div id="loginMsg" class="login-msg" aria-live="polite"></div></form></div>
<div id="app" hidden><header class="header"><div><b>Linas Opti</b><small>Clean Core V0.2.34</small></div><div class="header-status"><button id="githubSync" class="refresh" type="button" aria-label="Synka Lina med GitHub" title="Synka allt beständigt Lina-arbete med GitHub"><span aria-hidden="true">☁</span><small>Synka</small></button><button id="refreshApp" class="refresh" type="button" aria-label="Uppdatera Lina" title="Uppdatera Lina"><span aria-hidden="true">↻</span><small>Uppdatera</small></button><span>Robotmognad 48/100</span><strong>Handel AV</strong></div></header><main id="view"></main><div class="lina-watermark" aria-hidden="true"></div></div>
<script>
(function(){
  const gate=document.getElementById('loginGate'),form=document.getElementById('loginForm'),input=document.getElementById('loginCode'),msg=document.getElementById('loginMsg');
  const params=new URLSearchParams(window.location.search);
  const forceLogin=params.get('force_login')==='1';
  const navEntry=performance.getEntriesByType?.('navigation')?.[0];
  const browserReload=navEntry?.type==='reload';
  // V0.2.20: både Linas egen Uppdatera och webbläsarens vanliga Uppdatera ska ge en ren login-start.
  if(forceLogin || browserReload){
    sessionStorage.removeItem('linasopti_unlocked');
    sessionStorage.removeItem('linasopti_login_code');
  }
  if(forceLogin){
    history.replaceState(null,'',window.location.pathname);
  }

  // Återanvänd bevisad V0.46.3-lösning från legacy-Lina: loginfältet ska alltid öppna tomt.
  function clearLoginField(){
    input.value='';
    input.defaultValue='';
    input.removeAttribute('value');
  }
  clearLoginField();
  setTimeout(clearLoginField,50);
  setTimeout(clearLoginField,250);
  setTimeout(clearLoginField,800);
  window.addEventListener('pageshow',()=>{clearLoginField();setTimeout(clearLoginField,100);});
  document.addEventListener('focusin',e=>{
    if(e.target===input && document.body.classList.contains('locked')){
      if(!input.dataset.loginTouched){input.value='';input.dataset.loginTouched='1';}
    }
  });

  let opened=false;
  function open(){
    if(opened)return;opened=true;
    sessionStorage.setItem('linasopti_unlocked','1');
    // V0.2.20 permanent rule: every new start/login begins at index/Dashboard.
    // Old route hashes such as #g2 must never decide the initial view.
    history.replaceState(null,'',window.location.pathname);
    gate.style.display='none';gate.setAttribute('aria-hidden','true');document.body.classList.remove('locked');
    document.dispatchEvent(new CustomEvent('lina:unlocked'));
  }
  async function unlock(){
    const code=(input.value||'').trim();
    if(!code)return;
    msg.textContent='Kontrollerar…';msg.className='login-msg';
    try{
      const r=await fetch('https://linas-opti-api.mangaj73.workers.dev/auth-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(j.error||'Fel lösenkod');
      sessionStorage.setItem('linasopti_login_code',code);
      msg.textContent='✓ Kod godkänd';msg.className='login-msg';setTimeout(open,120);
    }catch(e){msg.textContent=e?.message==='Fel lösenkod'?'Fel lösenkod':'Inloggning kunde inte verifieras';msg.className='login-msg bad';input.focus();input.select();}
  }
  form.addEventListener('submit',function(e){e.preventDefault();unlock();});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.keyCode===13){
      e.preventDefault();
      unlock();
    }
  });
  if(sessionStorage.getItem('linasopti_unlocked')==='1')open();else setTimeout(()=>input.focus(),50);
})();
</script>
