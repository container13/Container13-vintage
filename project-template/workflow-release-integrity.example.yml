name: Project Release Integrity

on:
  push:
    paths:
      - 'PROJECT_ROOT/**'
  pull_request:
    paths:
      - 'PROJECT_ROOT/**'

concurrency:
  group: project-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PROJECT_ROOT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release integrity
        run: node release-integrity.mjs
